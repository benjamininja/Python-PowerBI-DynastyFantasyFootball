# data_model.yml — machine-readable logical-model manifest (SSOT).
#
# Mirrors docs/sources.yml's pattern: this file is the single source of truth
# for the star-schema graph. docs/DATA_MODEL.md renders a Mermaid flowchart
# FROM this file — do not hand-edit the generated region; edit here and run:
#     .\run.ps1 scripts/check_data_model.py --render
#
# Validation (see scripts/check_data_model.py):
#   - schema check (all tables)       : required fields, unique name, valid type
#   - column-drift check (all tables) : declared columns must match the real
#                                       data/{name}.parquet schema (name+dtype)
#   - edge-target check               : every edge.to / edge.via must resolve
#                                       to a table declared in this file
#   - key and type check              : every column has a known sql_type that
#                                       fits its dtype; pk equals grain; every
#                                       fk resolves to a key of the same type;
#                                       other_tables are well formed
#
# Field notes:
#   name    : table name, PK (== data/{name}.parquet stem)
#   type    : dim | fact | resolver
#             resolver = a bridge/crosswalk table whose whole job is routing
#             identity between other tables (dim_fantrax_crosswalk,
#             dim_dynasty_crosswalk, dim_player_alias, dim_roster_asset) —
#             per .claude/memory/data-model.md, dim_roster_asset explicitly
#             "generalizes the crosswalks one level up".
#   grain   : the natural key (informational — matches the memory doc's
#             documented key, not re-derived from the parquet)
#   columns : list of {name, dtype, sql_type} — dtype is pandas' dtype string,
#             checked against the real parquet schema by `validate`.
#             Every column carries `sql_type`, the Postgres type of the
#             table the migration generator makes (ADR-0018 decision 8;
#             #108). It follows dtype: str -> text (date for an ISO date
#             string), int32 / int64 / Int64 -> integer, float64 -> double
#             precision (integer for a whole-number column), bool ->
#             boolean, datetime64 -> timestamp, and a zone-aware datetime64
#             -> timestamptz (the owner's amendment of decision 8,
#             2026-10-31). A column with no value yet reads back as
#             `object`, which names no SQL type, so its `sql_type` is the
#             only record of what its values will be (#110). There is no
#             bigint: a value past the integer range is a finding.
#   pk      : the primary key, a list of columns equal to `grain`. The seam
#             and the publish gate read `pk` first.
#   fk      : foreign keys, each {columns, to, ref}: a column list, the table
#             it points at, and that table's key columns. Only the clean
#             edges of ADR-0018 decision 6; a dirty edge (player_key,
#             position_raw, scorer_id, a multi-column edge) has none.
#   checks  : SQL boolean expressions, one CHECK constraint each.
#   other_tables : tables with no parquet file (the `ops` and `shared`
#             tables), read only by the migration generator.
#   edges   : outbound relationships: {to: <table>, via: direct|<resolver
#             table name>, on: <join column(s)>}. `via: direct` = joins
#             straight to the target's key. `via: <resolver>` = the real
#             route is through that resolver table, not a direct FK.
#
# Check parameters (ADR-0008 amendment decisions 3, 4, 6, 16; read by
# notebooks/etl_checks.py):
#   chain         : the publish unit that writes this table — fantrax_core |
#                   rookie | dynasty_profile | nflverse. Absent = manual-only
#                   (written by hand-run notebooks, reaches main by PR; the
#                   pipeline never stages it). Steps in run_pipeline.py carry
#                   the same tag.
#   required_keys : columns that must be non-null on every row (the
#                   scorer_id / team_key / period-or-week set, where the table
#                   has them and they are never legitimately null).
#   shrink_limit  : optional; max fractional row-count drop against the last
#                   published snapshot (git HEAD) before the Gate blocks.
#                   Default 0.20. Shrinking to zero rows always blocks.
#   The grain Gate checks uniqueness of `grain` over rows whose grain columns
#   are all non-null; null-key rows file one `grain_null_key` Review finding.

tables:
  # --------------------------------------------------------------- dims
  - name: dim_nfl_players
    type: dim
    grain: gsis_id
    pk: [gsis_id]
    chain: nflverse
    columns:
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: display_name, dtype: str, sql_type: text }
      - { name: first_name, dtype: str, sql_type: text }
      - { name: last_name, dtype: str, sql_type: text }
      - { name: birth_date, dtype: str, sql_type: date }
      - { name: status, dtype: str, sql_type: text }
      - { name: team_abbr, dtype: str, sql_type: text }
      - { name: position, dtype: str, sql_type: text }
      - { name: position_group, dtype: str, sql_type: text }
      - { name: jersey_number, dtype: str, sql_type: text }
      - { name: years_of_experience, dtype: int32, sql_type: integer }
      - { name: college_name, dtype: str, sql_type: text }
      - { name: college_conference, dtype: str, sql_type: text }
      - { name: entry_year, dtype: int32, sql_type: integer }
      - { name: last_season, dtype: int32, sql_type: integer }
      - { name: draft_year, dtype: float64, sql_type: integer }
      - { name: draft_club, dtype: str, sql_type: text }
      - { name: draft_round, dtype: float64, sql_type: integer }
      - { name: draft_number, dtype: float64, sql_type: integer }
      - { name: height, dtype: float64, sql_type: "double precision" }
      - { name: weight, dtype: float64, sql_type: integer }
      - { name: pfr_id, dtype: str, sql_type: text }
      - { name: pff_id, dtype: str, sql_type: text }
      - { name: espn_id, dtype: str, sql_type: text }
      - { name: esb_id, dtype: str, sql_type: text }
      - { name: nfl_id, dtype: str, sql_type: text }
      - { name: otc_id, dtype: str, sql_type: text }
      - { name: smart_id, dtype: str, sql_type: text }
    edges:
      - { to: dim_nfl_teams, via: direct, on: team_abbr }

  - name: dim_rookie_prospect
    type: dim
    grain: player_key
    pk: [player_key]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: rookie
    columns:
      - { name: player_key, dtype: str, sql_type: text }
      - { name: player_name, dtype: str, sql_type: text }
      - { name: player_name_clean, dtype: str, sql_type: text }
      - { name: position_raw, dtype: str, sql_type: text }
      - { name: position_detail, dtype: str, sql_type: text }
      - { name: position_group, dtype: str, sql_type: text }
      - { name: side_of_ball, dtype: str, sql_type: text }
      - { name: fantasy_relevant, dtype: bool, sql_type: boolean }
      - { name: school_raw, dtype: str, sql_type: text }
      - { name: school_canonical, dtype: str, sql_type: text }
      - { name: conference, dtype: str, sql_type: text }
      - { name: height_inches, dtype: float64, sql_type: "double precision" }
      - { name: weight, dtype: float64, sql_type: integer }
      - { name: pfr_id, dtype: str, sql_type: text }
      - { name: cfb_id, dtype: str, sql_type: text }
      - { name: gsis_id, dtype: object, sql_type: text }
      - { name: draft_year, dtype: int64, sql_type: integer }
      - { name: source, dtype: str, sql_type: text }
      - { name: added_date, dtype: str, sql_type: date }
    edges:
      - { to: dim_school, via: direct, on: school_raw }
      - { to: dim_position, via: direct, on: position_raw }

  - name: dim_position
    type: dim
    grain: position_raw
    pk: [position_raw]
    columns:
      - { name: position_raw, dtype: str, sql_type: text }
      - { name: position_detail, dtype: str, sql_type: text }
      - { name: position_group, dtype: str, sql_type: text }
      - { name: position_sort_order, dtype: int64, sql_type: integer }
      - { name: side_of_ball, dtype: str, sql_type: text }
      - { name: side_of_ball_sort_order, dtype: int64, sql_type: integer }
      - { name: fantasy_relevant, dtype: bool, sql_type: boolean }
    edges: []

  - name: dim_school
    type: dim
    grain: school_raw
    pk: [school_raw]
    columns:
      - { name: school_raw, dtype: str, sql_type: text }
      - { name: school_canonical, dtype: str, sql_type: text }
      - { name: school_abbr, dtype: str, sql_type: text }
      - { name: conference, dtype: str, sql_type: text }
    edges: []

  - name: dim_contract
    type: dim
    grain: contract_id
    pk: [contract_id]
    columns:
      - { name: contract_id, dtype: str, sql_type: text }
      - { name: contract_type, dtype: str, sql_type: text }
      - { name: contract_label, dtype: str, sql_type: text }
      - { name: salary_type, dtype: str, sql_type: text }
      - { name: contract_year, dtype: Int64, sql_type: integer }
      - { name: total_years, dtype: Int64, sql_type: integer }
      - { name: cap_hit_pct, dtype: float64, sql_type: "double precision" }
      - { name: guaranteed, dtype: bool, sql_type: boolean }
      - { name: cap_exempt, dtype: bool, sql_type: boolean }
      - { name: min_salary, dtype: float64, sql_type: "double precision" }
      - { name: notes, dtype: str, sql_type: text }
    edges: []
    notes: >
      11 rows, seeded by 01b. `Minor` is the stage before `1st` (ADR-0019):
      it has no term, so contract_year and total_years are null on that row
      (hence the nullable Int64), and it costs no Dead Money (cap_hit_pct 0,
      not guaranteed). `cap_exempt` is descriptive only: no consumer reads
      it. The cap exemption is by Roster Slot, Minors and IR
      (fact_fantasy_teams.cap_exempt, #97; IR since the owner's ruling of
      2026-10-12, reversing ADR-0011).

  - name: dim_fantasy_teams
    type: dim
    grain: team_key
    pk: [team_key]
    required_keys: [team_key]
    columns:
      - { name: team_key, dtype: str, sql_type: text }
      - { name: team_name, dtype: str, sql_type: text }
      - { name: team_abbr, dtype: str, sql_type: text }
      - { name: fantrax_team_id, dtype: str, sql_type: text }
      - { name: conference, dtype: str, sql_type: text }
      - { name: division, dtype: str, sql_type: text }
      - { name: original_cap, dtype: int64, sql_type: integer }
      - { name: reinvestment_cap, dtype: int64, sql_type: integer }
    edges:
      - { to: dim_division, via: direct, on: conference }

  - name: dim_nfl_teams
    type: dim
    grain: team_abbr
    pk: [team_abbr]
    columns:
      - { name: team_abbr, dtype: str, sql_type: text }
      - { name: team_name, dtype: str, sql_type: text }
      - { name: team_id_pfr, dtype: object, sql_type: text }
      - { name: team_conf, dtype: str, sql_type: text }
      - { name: team_division, dtype: str, sql_type: text }
      - { name: team_color, dtype: str, sql_type: text }
      - { name: team_color2, dtype: str, sql_type: text }
      - { name: team_logo_wikipedia, dtype: str, sql_type: text }
      - { name: team_logo_espn, dtype: str, sql_type: text }
      - { name: team_wordmark, dtype: str, sql_type: text }
      - { name: team_stadium, dtype: object, sql_type: text }
    edges: []

  - name: dim_dynasty_metric
    type: dim
    grain: metric_key
    pk: [metric_key]
    chain: dynasty_profile
    columns:
      - { name: metric_key, dtype: str, sql_type: text }
      - { name: metric_label, dtype: str, sql_type: text }
      - { name: metric_group, dtype: str, sql_type: text }
      - { name: metric_order, dtype: int64, sql_type: integer }
      - { name: value_type, dtype: str, sql_type: text }
      - { name: direction, dtype: str, sql_type: text }
      - { name: source_name, dtype: str, sql_type: text }
    edges: []

  - name: dim_pick_value_curve
    type: dim
    grain: "(snapshot_date, source_name, draft_year, round, tier)"
    pk: [snapshot_date, source_name, draft_year, round, tier]
    columns:
      - { name: snapshot_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: source_name, dtype: str, sql_type: text }
      - { name: draft_year, dtype: int64, sql_type: integer }
      - { name: round, dtype: int64, sql_type: integer }
      - { name: tier, dtype: str, sql_type: text }
      - { name: value, dtype: float64, sql_type: "double precision" }
    edges: []

  - name: dim_position_ceiling
    type: dim
    grain: "(snapshot_date, conference, position_group)"
    pk: [snapshot_date, conference, position_group]
    columns:
      - { name: snapshot_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: conference, dtype: str, sql_type: text }
      - { name: position_group, dtype: str, sql_type: text }
      - { name: pool_size, dtype: int64, sql_type: integer }
      - { name: n_rostered, dtype: float64, sql_type: "double precision" }
      - { name: n_free_agents, dtype: float64, sql_type: "double precision" }
      - { name: max_fpts, dtype: float64, sql_type: "double precision" }
      - { name: replacement_fpts, dtype: float64, sql_type: "double precision" }
      - { name: best_free_agent, dtype: str, sql_type: text }
      - { name: vor, dtype: float64, sql_type: "double precision" }
      - { name: ceiling, dtype: float64, sql_type: "double precision" }
      - { name: source_season, dtype: int64, sql_type: integer }
      - { name: source_week, dtype: str, sql_type: text }
    edges: []
    notes: >
      Cross-position scarcity multiplier for mouserat_trade-bud. VOR =
      max_fpts - replacement_fpts, where replacement is the best free agent
      at that position (opportunity cost), computed per 14-team conference
      because the two conferences are separate player pools. conference =
      "ALL" averages the two conferences' vor before rescaling to top = 100,
      and is the row the app reads. position_group is normalized through
      dim_position; not a key join, so no edge.

  - name: fact_draft_pick
    type: fact
    grain: pick_ref
    pk: [pick_ref]
    fk:
      - { columns: [current_owner], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [draft_season], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    columns:
      - { name: pick_ref, dtype: str, sql_type: text }
      - { name: draft_season, dtype: str, sql_type: text }
      - { name: round, dtype: int64, sql_type: integer }
      - { name: pick_in_round, dtype: int64, sql_type: integer }
      - { name: overall_slot, dtype: int64, sql_type: integer }
      - { name: original_owner, dtype: str, sql_type: text }
      - { name: division_id, dtype: str, sql_type: text }
      - { name: current_owner, dtype: str, sql_type: text }
      - { name: is_made, dtype: bool, sql_type: boolean }
      - { name: draft_type, dtype: str, sql_type: text }
    edges:
      - { to: dim_season, via: direct, on: "draft_season -> season_id" }
      - { to: dim_fantasy_teams, via: direct, on: "current_owner -> team_key" }
    notes: >
      original_owner is inferred (not sourced from Fantrax -- no such field
      exists in getDraftResults): round 1's own slot assignment is taken as
      the draft order, expanded to later rounds via the snake rule.

  - name: fact_draft_pick_future
    type: fact
    grain: pick_ref
    pk: [pick_ref]
    fk:
      - { columns: [current_owner], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [draft_season], to: dim_season, ref: [season_id] }
    columns:
      - { name: pick_ref, dtype: str, sql_type: text }
      - { name: draft_season, dtype: str, sql_type: text }
      - { name: round, dtype: int64, sql_type: integer }
      - { name: pick_in_round, dtype: object, sql_type: integer }
      - { name: overall_slot, dtype: object, sql_type: integer }
      - { name: original_owner, dtype: str, sql_type: text }
      - { name: division_id, dtype: str, sql_type: text }
      - { name: current_owner, dtype: str, sql_type: text }
      - { name: is_made, dtype: bool, sql_type: boolean }
      - { name: is_slotted, dtype: bool, sql_type: boolean }
      - { name: draft_type, dtype: str, sql_type: text }
    edges:
      - { to: dim_season, via: direct, on: "draft_season -> season_id" }
      - { to: dim_fantasy_teams, via: direct, on: "current_owner -> team_key" }

  - name: dim_season
    type: dim
    grain: season_id
    pk: [season_id]
    chain: fantrax_core
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: season_start_year, dtype: int64, sql_type: integer }
      - { name: season_end_year, dtype: int64, sql_type: integer }
      - { name: season_fantasy_start_date, dtype: "datetime64[ms]", sql_type: timestamp }
      - { name: season_fantasy_end_date, dtype: "datetime64[ms]", sql_type: timestamp }
      - { name: season_nfl_start_date, dtype: "datetime64[ms]", sql_type: timestamp }
      - { name: season_nfl_end_date, dtype: "datetime64[ms]", sql_type: timestamp }
      - { name: theme, dtype: str, sql_type: text }
      - { name: relative_nfl_season_number, dtype: int64, sql_type: integer }
    edges: []

  - name: dim_division
    type: dim
    grain: "(season_id, conference)"
    pk: [season_id, conference]
    fk:
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [season_id, conference, division_name]
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: conference, dtype: str, sql_type: text }
      - { name: division_name, dtype: str, sql_type: text }
    edges:
      - { to: dim_season, via: direct, on: season_id }
    notes: >
      The season's Division name per Conference, from public
      getLeagueInfo.teamInfo[].division (04p; ADR-0016 amendment decision
      12). Each team's Conference comes from dim_fantasy_teams by
      fantrax_team_id. 04p fails, and the Chain is held, unless each Fantrax
      division maps to exactly one Conference and each Conference to one
      division. A run replaces its own season's rows only.

  - name: dim_scoring_period
    type: dim
    grain: "(season_id, period)"
    pk: [season_id, period]
    fk:
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [season_id, period, start_date, end_date, start_at, end_at, is_playoff]
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: period, dtype: int64, sql_type: integer }
      - { name: start_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: end_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: start_at, dtype: "datetime64[us, UTC]", sql_type: timestamptz }
      - { name: end_at, dtype: "datetime64[us, UTC]", sql_type: timestamptz }
      - { name: is_playoff, dtype: bool, sql_type: boolean }
      - { name: update_set_state, dtype: str, sql_type: text }
      - { name: closed_at, dtype: "datetime64[us, UTC]", sql_type: timestamptz }
    edges:
      - { to: dim_season, via: direct, on: season_id }
    notes: >
      Every Scoring Period of the season (17 in 2026-2027), from public
      getLeagueInfo.scoringPeriods (04p; ADR-0016 amendment decisions 2 and
      14). start_at / end_at are the exact bounds Fantrax serves, stored in
      UTC; start_date / end_date are the same instants as days on the
      league's Eastern clock. Periods turn over on a Thursday evening, so a
      period's end_date equals the next period's start_date: use the
      timestamps to place an instant in a period. is_playoff is true from
      playoffs.firstPlayoffPeriod on. update_set_state is open | closing |
      closed, and null for a playoff period or one that has not started.
      04p closes a period once the following period has ended and its Close
      checks pass (etl_checks.close_errors: its Roster State covers 28
      teams, its Matchups hold every team once and mirror, each Matchup
      score is the team's Starter sum), and stamps closed_at with the
      instant of that run. A closed period is frozen: 04r and 04s skip it,
      and nothing re-opens it until #93's --reclose. A period that fails its
      checks stays closing.

  # ----------------------------------------------------------- resolvers
  - name: dim_fantrax_crosswalk
    type: resolver
    grain: scorer_id
    pk: [scorer_id]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: fantrax_core
    required_keys: [scorer_id]
    columns:
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: player_name, dtype: str, sql_type: text }
      - { name: position_raw, dtype: str, sql_type: text }
      - { name: nfl_team, dtype: str, sql_type: text }
      - { name: is_rookie, dtype: bool, sql_type: boolean }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: player_key, dtype: str, sql_type: text }
      - { name: match_method, dtype: str, sql_type: text }
      - { name: match_score, dtype: int64, sql_type: integer }
      - { name: resolved_date, dtype: str, sql_type: date }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: dim_dynasty_crosswalk
    type: resolver
    grain: source_uid
    pk: [source_uid]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: dynasty_profile
    columns:
      - { name: source, dtype: str, sql_type: text }
      - { name: source_player_id, dtype: str, sql_type: text }
      - { name: source_player_name, dtype: str, sql_type: text }
      - { name: source_position, dtype: str, sql_type: text }
      - { name: source_team, dtype: str, sql_type: text }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: player_key, dtype: str, sql_type: text }
      - { name: match_method, dtype: str, sql_type: text }
      - { name: match_score, dtype: int64, sql_type: integer }
      - { name: resolved_date, dtype: str, sql_type: date }
      - { name: source_uid, dtype: str, sql_type: text }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: dim_player_alias
    type: resolver
    grain: "(name_clean, position_raw)"
    pk: [name_clean, position_raw]
    chain: rookie
    columns:
      - { name: name_clean, dtype: str, sql_type: text }
      - { name: position_raw, dtype: str, sql_type: text }
      - { name: player_key, dtype: str, sql_type: text }
      - { name: decision, dtype: str, sql_type: text }
      - { name: source_example, dtype: str, sql_type: text }
      - { name: decided_date, dtype: str, sql_type: date }
    edges:
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: dim_roster_asset
    type: resolver
    grain: asset_id
    pk: [asset_id]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: fantrax_core
    columns:
      - { name: asset_id, dtype: int64, sql_type: integer }
      - { name: asset_type, dtype: str, sql_type: text }
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: player_key, dtype: str, sql_type: text }
      - { name: pick_ref, dtype: str, sql_type: text }
    edges:
      - { to: dim_fantrax_crosswalk, via: direct, on: scorer_id }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }
      - { to: fact_draft_pick, via: direct, on: pick_ref }
      - { to: fact_draft_pick_future, via: direct, on: pick_ref }
    notes: >
