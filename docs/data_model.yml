      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }
      - { to: dim_contract, via: direct, on: contract_id }
    notes: >
      The current Roster State, all year (ADR-0016 decision 8, #97): one row
      per player copy, from the newest getTeamRosters reply 04r saved
      (contract_value is Fantrax's salary, contract_id its contract). The
      ledger adds acquired_method / acquired_date from the move that opened
      the copy's open stint, else `unknown`. cap_hit is contract_value, or 0
      when cap_exempt: the Minors or IR slot (owner's ruling 2026-10-12;
      etl_cap.EXEMPT_SLOTS). dim_contract.cap_exempt is a different,
      descriptive flag that nothing reads. roster_captured_at is the reply's
      read instant (null when built from the ledger replay out of season,
      with roster_slot blank); ledger_captured_at is the newest transaction
      capture's. The Review check roster_membership compares the two
      streams. roster_slot is Starter / Bench / IR / Minors, the vocabulary of
      fact_roster_state (ADR-0016 decision 16, #110).

  - name: fact_team_cap
    type: fact
    grain: "(season_id, team_key)"
    pk: [season_id, team_key]
    fk:
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [season_id, team_key, is_current_season, original_cap, reinvestment_cap, charged_salary, ir_salary, minors_salary, dead_money, cap_room]
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: team_key, dtype: str, sql_type: text }
      - { name: is_current_season, dtype: bool, sql_type: boolean }
      - { name: original_cap, dtype: float64, sql_type: "double precision" }
      - { name: reinvestment_cap, dtype: float64, sql_type: "double precision" }
      - { name: charged_salary, dtype: float64, sql_type: "double precision" }
      - { name: ir_salary, dtype: float64, sql_type: "double precision" }
      - { name: minors_salary, dtype: float64, sql_type: "double precision" }
      - { name: dead_money, dtype: float64, sql_type: "double precision" }
      - { name: cap_room, dtype: float64, sql_type: "double precision" }
      - { name: roster_captured_at, dtype: "datetime64[us, UTC]", sql_type: timestamptz }
      - { name: fantrax_salary_remaining, dtype: float64, sql_type: "double precision" }
      - { name: fantrax_captured_at, dtype: "datetime64[us, UTC]", sql_type: timestamptz }
      - { name: fantrax_period, dtype: Int64, sql_type: integer }
    edges:
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_season, via: direct, on: season_id }
    notes: >
      The published cap table (ADR-0016's #97 amendment, decisions 4 and 5):
      two rows per team, written whole by 02h with etl_cap's rules. This
      season is the one `season` on fact_fantasy_teams, never the calendar
      (is_current_season true); next season is dim_season's following one.
      charged_salary on the current row sums fact_fantasy_teams.cap_hit, so
      Minors and IR salary charge nothing and show in minors_salary and
      ir_salary. On the next-season row it sums every contract with a
      following year (contract_year < total_years, plus `Minor`) at the same
      salary, no slot exempt, so ir_salary and minors_salary are 0. dead_money
      is that season's rows of fact_dead_money only. cap_room is original_cap
      - charged_salary - dead_money - reinvestment_cap; reinvestment_cap is an
      in-season charge, 0 on the next-season row. The last four columns are
      null on the next-season row. roster_captured_at is the roster's read
      instant; null on the current row marks a roster built from the ledger
      replay out of season, where slots are blank and every salary is charged.
      fantrax_salary_remaining is Fantrax's own number, from the newest
      standings reply 04s saved for this season (fantrax_captured_at,
      fantrax_period); null with no such file, or with a reply 02h cannot read
      (a warning, never a held Chain). Gate team_cap: 28 teams per season, the
      seasons are the roster's and its following one, every figure equals a
      recompute, and each season's Dead Money is all on known teams. Review
      salary_remaining: Fantrax's number against original_cap - charged_salary
      - ir_salary - dead_money, to $1, only when the roster read and the
      capture fall on the same league day; on any other run it files and
      clears nothing. Fantrax
      charges IR and is treated as wrong on this point, which is why IR is
      added back.

  - name: fact_roster_transactions
    type: fact
    grain: "(transaction_id, scorer_id, team_key, event_type)"
    pk: [transaction_id, scorer_id, team_key, event_type]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [contract_id], to: dim_contract, ref: [contract_id] }
      - { columns: [asset_id], to: dim_roster_asset, ref: [asset_id] }
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [transaction_id, scorer_id, team_key, event_type]
    columns:
      - { name: transaction_id, dtype: str, sql_type: text }
      - { name: season_id, dtype: str, sql_type: text }
      - { name: event_type, dtype: str, sql_type: text }
      - { name: team_key, dtype: str, sql_type: text }
      - { name: asset_id, dtype: int64, sql_type: integer }
      - { name: event_seq, dtype: int64, sql_type: integer }
      - { name: event_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: period, dtype: Int64, sql_type: integer }
      - { name: contract_id, dtype: str, sql_type: text }
      - { name: contract_year, dtype: float64, sql_type: integer }
      - { name: contract_value, dtype: float64, sql_type: "double precision" }
      - { name: contract_source, dtype: str, sql_type: text }
      - { name: status, dtype: str, sql_type: text }
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: draft_round, dtype: float64, sql_type: integer }
      - { name: pick_in_round, dtype: float64, sql_type: integer }
      - { name: pick_overall, dtype: float64, sql_type: integer }
      - { name: source, dtype: str, sql_type: text }
      - { name: claim_method, dtype: str, sql_type: text }
      - { name: claim_bid, dtype: float64, sql_type: "double precision" }
    edges:
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_roster_asset, via: direct, on: asset_id }
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_contract, via: direct, on: contract_id }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      The grain is the stable move key (ADR-0016 decision 6, built in #96).
      transaction_id is Fantrax's txSetId on a trade, claim or drop, and the
      slot's pick_ref (fact_draft_pick) on a startup_draft row, so a rebuild
      never changes a row's key. event_seq is sort order only: it renumbers
      whenever a capture adds or removes a move, and 02e's replay sorts by it.
      period is the Scoring Period the move takes effect in (Fantrax's own
      stamp; 1 on a draft pick; null on a move of another season).
      contract_id is observed, never derived (ADR-0019 decision 6): 02d reads
      it off fact_roster_state, by the Scoring Period Fantrax says the move
      takes effect in. A draft pick (period 1) and a claim read the first
      Roster State inside the stint they start: from the move's period up to
      the period the copy next leaves that team in. A trade and a drop read
      the latest one inside the stint, before the move's period. A pick or a
      claim that no Roster State row covers reads the fact_preseason_salary
      capture, when it was taken inside the stint the move starts and the
      player is not minors-eligible (#96 decision 1). With neither,
      the contract defaults to `Minor` for a player listed in the
      fact_minor_eligibility capture on either side of the move, else the
      contract the copy already held, else `1st` (draft) or `FA` (claim).
      contract_source says where the contract was read: roster_state,
      preseason or default. An eligible player's `Minor` is default, whether
      or not the capture shows the stint. A trade or a drop with no Roster
      State row of its own keeps the contract of the stint it ends and that
      stint's source; a contract the default rule changed on the way is
      default. no_stint marks
      a drop by a team the ledger never saw the copy join (no draft pick,
      claim or trade into it): it ends no stint and makes no Dead Money (#96
      decision 2).
      contract_year follows dim_contract, so it is null on a `Minor` row.
      contract_value on a draft pick or a claim is the salary on the
      fact_preseason_salary capture when it was taken inside the stint the
      move starts (after the move day, before the copy next left that team),
      else the salary on that first Roster State. With neither, a draft pick
      takes the fact_fantrax_adp salary of the draft's own season (the latest
      capture on or before the pick day, else the earliest after it, never
      below the league minimum; the league minimum when the season has no
      capture), and a claim takes the salary the copy held this season in
      this Conference, else the league minimum. A trade and a drop carry the
      copy's salary (#125, #117).
      The dead_money column, always 0, was dropped in #96: Dead Money is its
      own fact. The cap_hit column was dropped in #251: a player's charge is
      fact_fantasy_teams.cap_hit.

  - name: fact_dead_money
    type: fact
    grain: "(transaction_id, scorer_id, team_key, season_id)"
    pk: [transaction_id, scorer_id, team_key, season_id]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [contract_id], to: dim_contract, ref: [contract_id] }
      - { columns: [charge_contract_id], to: dim_contract, ref: [contract_id] }
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [transaction_id, scorer_id, team_key, season_id, drop_date, contract_id, contract_value, charge_contract_id, cap_hit_pct, dead_money, contract_source]
    columns:
      - { name: transaction_id, dtype: str, sql_type: text }
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: team_key, dtype: str, sql_type: text }
      - { name: season_id, dtype: str, sql_type: text }
      - { name: drop_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: drop_period, dtype: Int64, sql_type: integer }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: contract_id, dtype: str, sql_type: text }
      - { name: contract_value, dtype: float64, sql_type: "double precision" }
      - { name: charge_contract_id, dtype: str, sql_type: text }
      - { name: cap_hit_pct, dtype: float64, sql_type: "double precision" }
      - { name: dead_money, dtype: float64, sql_type: "double precision" }
      - { name: contract_source, dtype: str, sql_type: text }
    edges:
      - { to: fact_roster_transactions, via: direct, on: "transaction_id, scorer_id, team_key" }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_contract, via: direct, on: "contract_id, charge_contract_id -> contract_id" }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      Dead Money (ADR-0016 decision 5, built in #96): one row per season
      charged for each drop of a guaranteed contract. 02f derives it from the
      drop rows of fact_roster_transactions and rewrites the whole table on
      every run. The schedule is read from dim_contract: the guaranteed rows
      of the dropped contract's contract_type from its contract_year on, each
      at its cap_hit_pct of the salary at the drop. A `1st` drop is two rows
      (.50 in the drop's season, .40 in the next); `2nd` and `Tag` one;
      `3rd`, `X`, `FA` and `Minor` none. season_id is the season charged,
      contract_id the contract at the drop, charge_contract_id the schedule
      row that prices this season, drop_date and drop_period the ledger's
      event_date and period (period is null on a drop of another season). A
      next-season charge uses the salary at the drop. Only a drop that ends a
      stint is charged: a drop with contract_source no_stint writes no row
      (#96 decision 2) and is listed by the stintless_drop Review check.
      Re-claiming the player does not cancel the charge. Preseason drops are
      charged, as Fantrax does. Gate `schedule`: dead_money is cap_hit_pct x
      contract_value; the charging contract is a guaranteed dim_contract row
      at that rate; every row is a drop on the ledger that ends a stint; every
      such drop of a guaranteed contract has a row. Read by 02h, which sums
      each season's rows into fact_team_cap (ADR-0016's #97 amendment); the
      bot and trade-bud read fact_team_cap, not this table. Power BI loads
      it as Fact_DeadMoney (#140): the three Dead Money - Active measures
      sum it by Dim_Season.relative_nfl_season_number.

