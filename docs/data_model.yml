      ownership from each team's own pick), and so its Original Owner. A
      pick leg that resolves to no pick is written to
      data/review/review_trade_log_picks.csv and is not in the table.
      draft_year, draft_round and pick_in_round are the leg as Fantrax shows
      it: whole numbers, empty on a player row (Int64, so the file holds
      integers and a pandas read gives Int64, not float64; #77).

  - name: fact_roster_state
    type: fact
    grain: "(season_id, period, team_key, scorer_id)"
    pk: [season_id, period, team_key, scorer_id]
    fk:
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [contract_id], to: dim_contract, ref: [contract_id] }
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [season_id, period, team_key, scorer_id, roster_slot, salary, contract_id, capture_date]
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: period, dtype: int64, sql_type: integer }
      - { name: team_key, dtype: str, sql_type: text }
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: roster_slot, dtype: str, sql_type: text }
      - { name: salary, dtype: float64, sql_type: "double precision" }
      - { name: contract_id, dtype: str, sql_type: text }
      - { name: capture_date, dtype: "datetime64[us]", sql_type: timestamp }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_contract, via: direct, on: contract_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      The Roster State of each regular-season Scoring Period: one row per
      player copy on a team, from public getTeamRosters?period=N (04r; no
      login; ADR-0016 decision 3 and its amendment, decisions 3 and 14).
      Players are keyed by scorer_id only. roster_slot is Starter | Bench |
      IR | Minors (Fantrax ACTIVE | RESERVE | INJURED_RESERVE | MINORS).
      salary and contract_id are what Fantrax shows on the roster row.
      capture_date is the day, on the league's Eastern clock, the period was
      last read; a period moves until its lineup lock and is frozen after.
      A run reads every period that
      has started and is not closed, up to the period Fantrax calls current,
      and replaces each one whole. Fantrax answers a request for a future
      period with the current roster, so no period is read before the
      calendar and Fantrax both say it has started. Gates: all 28 teams (14
      per Conference) in the newest period, and every contract_id in
      dim_contract. salary is rounded to the cent (the API serves some
      whole-dollar salaries a float hair off). A period's roster is the
      roster at that period's lineup lock: it shows every move Fantrax stamps
      for that period or earlier. Read by 02d (each move's contract and
      salary), 02e (roster_slot, from the newest period) and 04e (who is
      rostered).

