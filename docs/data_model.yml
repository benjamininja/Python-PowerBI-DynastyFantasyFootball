      - { name: capture_date, dtype: "datetime64[us]", sql_type: timestamp }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: fact_roster_state, via: direct, on: "season_id, period, team_key, scorer_id" }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      Period Scoring: the fantasy points of each rostered player in each
      regular-season Scoring Period, per team, split by Unit (04s, from the
      logged-in getLiveScoringStats with the bench view; ADR-0016 amendment
      decisions 1 and 5, ADR-0017 decision 2). One row per player with a
      live-scoring entry; a rostered player with no entry gets no row (no
      zero-fill). fpts is the player's total as Fantrax serves it. The three
      Unit columns are his stats' points summed by Unit: a stat's group is
      Offense or Defense, and the return-yards and blocked-kick categories
      are Special Teams in either group. is_starter is true when Fantrax
      lists the player under ACTIVE; only Starters count toward the Team
      Score. A period loads once its games are final (allEventsFinished),
      even while its Update-Set is still open, and is replaced whole on
      every run until it is closed. capture_date is the Eastern day the raw
      capture was written. The load fails unless every team's Starter points
      sum to the totalFpts Fantrax serves. Gates: the Units sum to fpts
      (0.01); every row is on that period's fact_roster_state, with
      is_starter true exactly when its Roster Slot is Starter; every period
      held covers 28 teams, and every period from 1 to the last closed one
      is held.

  - name: fact_matchup
    type: fact
    grain: "(season_id, period, team_key)"
    pk: [season_id, period, team_key]
    fk:
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [opponent_team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    chain: fantrax_core
    required_keys: [season_id, period, team_key, opponent_team_key, is_home, fpts_for, fpts_against, capture_date]
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: period, dtype: int64, sql_type: integer }
      - { name: team_key, dtype: str, sql_type: text }
      - { name: opponent_team_key, dtype: str, sql_type: text }
      - { name: is_home, dtype: bool, sql_type: boolean }
      - { name: fpts_for, dtype: float64, sql_type: "double precision" }
      - { name: fpts_against, dtype: float64, sql_type: "double precision" }
      - { name: capture_date, dtype: "datetime64[us]", sql_type: timestamp }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_fantasy_teams, via: direct, on: "team_key, opponent_team_key -> team_key" }
    notes: >
      Matchups: one row per team per regular-season Scoring Period, so each
      matchup is two mirrored rows (04s, from the logged-in getStandings
      view=SCHEDULE; ADR-0016 amendment decision 9). fpts_for and
      fpts_against are the two Team Scores as the schedule shows them; win,
      loss or tie is derived from them, not stored. is_home is the side the
      schedule lists the team on. Holds loaded periods only: a period loads
      with its Period Scoring, once its games are final, and is replaced
      whole on every run until it is closed. The future schedule is not
      stored. The load fails unless the week's matchups hold every team
      once. Gate: every row mirrors its opponent's row (sides and scores
      swapped). Standings are derived from this table and not stored
      (ADR-0016 amendment decision 11): teams ordered as of a period by win
      percentage, then points for.

  - name: fact_preseason_salary
    type: fact
    grain: "(season_id, team_key, scorer_id)"
    pk: [season_id, team_key, scorer_id]
    fk:
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
      - { columns: [contract_id], to: dim_contract, ref: [contract_id] }
      - { columns: [season_id], to: dim_season, ref: [season_id] }
    required_keys: [season_id, team_key, scorer_id, salary, contract_id, capture_date]
    columns:
      - { name: season_id, dtype: str, sql_type: text }
      - { name: team_key, dtype: str, sql_type: text }
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: salary, dtype: float64, sql_type: "double precision" }
      - { name: contract_id, dtype: str, sql_type: text }
      - { name: capture_date, dtype: "datetime64[us]", sql_type: timestamp }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_contract, via: direct, on: contract_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      Frozen. The salary and contract of every player copy on a roster in the
      2026-07-18 preseason capture, copied once from the retired
      fact_roster_placement (#117). It keeps the terms of a draft pick or a
      claim that left its team before Scoring Period 1, which
      fact_roster_state cannot show. contract_id was added in #96 from the
      same capture (the `contract` column of fact_roster_placement as
      committed in 995f663; 987 `1st`, 5 `FA`). 02d reads it only for a stint
      no Roster State row shows, and a minors-eligible player is `Minor`
      whatever it says: the capture predates the `Minor` label (#96 decision
      1, amending ADR-0019 decision 6). No step writes it and it has no
      Chain; a later season's rows would arrive by PR.

  - name: fact_minor_eligibility
    type: fact
    grain: "(scorer_id, season, week)"
    pk: [scorer_id, season, week]
    chain: fantrax_core
    required_keys: [scorer_id, week]
    columns:
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: player_name, dtype: str, sql_type: text }
      - { name: position_raw, dtype: str, sql_type: text }
      - { name: nfl_team, dtype: str, sql_type: text }
      - { name: fa_status, dtype: str, sql_type: text }
      - { name: salary, dtype: float64, sql_type: "double precision" }
      - { name: contract, dtype: str, sql_type: text }
      - { name: games_played, dtype: object, sql_type: integer }
      - { name: season, dtype: int64, sql_type: integer }
      - { name: week, dtype: str, sql_type: text }
      - { name: capture_date, dtype: str, sql_type: date }
    edges:
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }

  - name: fact_nfl_snap_counts
    type: fact
    grain: "(gsis_id, game_id)"
    pk: [gsis_id, game_id]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: nflverse
    required_keys: [gsis_id, game_id, season, week, team]
    columns:
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: game_id, dtype: str, sql_type: text }
      - { name: season, dtype: int64, sql_type: integer }
      - { name: week, dtype: int64, sql_type: integer }
      - { name: team, dtype: str, sql_type: text }
      - { name: offense_snaps, dtype: float64, sql_type: integer }
      - { name: offense_pct, dtype: float64, sql_type: "double precision" }
      - { name: defense_snaps, dtype: float64, sql_type: integer }
      - { name: defense_pct, dtype: float64, sql_type: "double precision" }
      - { name: st_snaps, dtype: float64, sql_type: integer }
      - { name: st_pct, dtype: float64, sql_type: "double precision" }
      - { name: period, dtype: Int64, sql_type: integer }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
    notes: >
      Snaps by Unit per player and NFL game, current season only (02g;
      nflverse load_snap_counts; ADR-0017, built in #86). game_id is the
      nflverse game id; season and week are the NFL's. The pct columns are
      the player's share of his team's snaps of that Unit, 0 to 1.
      load_snap_counts knows a player by his pfr id only; it is mapped to
      gsis_id through load_rosters_weekly, and a row with no mapping is
      dropped (almost all offensive linemen and long snappers). period is
      the Scoring Period the game date falls in, by dim_scoring_period
      (start_date <= game day < end_date); empty when it falls in none.
      Each run replaces the season. Not an Update-Set: no freeze, no Drift.

  - name: fact_nfl_injuries
    type: fact
    grain: "(gsis_id, season, week)"
    pk: [gsis_id, season, week]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: nflverse
    required_keys: [gsis_id, season, week, team]
    columns:
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: season, dtype: int64, sql_type: integer }
      - { name: week, dtype: int64, sql_type: integer }
      - { name: game_type, dtype: str, sql_type: text }
      - { name: team, dtype: str, sql_type: text }
      - { name: report_status, dtype: str, sql_type: text }
      - { name: report_primary_injury, dtype: str, sql_type: text }
      - { name: practice_status, dtype: str, sql_type: text }
      - { name: period, dtype: Int64, sql_type: integer }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
    notes: >
      The weekly NFL injury report, one row per player and NFL week, current
      season only (02g; nflverse load_injuries; ADR-0017, built in #86).
      report_status is the game status (Out, Doubtful, Questionable; empty
      when the player carries none); practice_status is the last practice
      line of the week. period is the Scoring Period of the team's game
      that week (the week's first game day when the team has none), by
      dim_scoring_period; empty when it falls in none. Each run replaces
      the season. Not an Update-Set: no freeze, no Drift.

  - name: fact_rookie_rankings
    type: fact
    grain: "(player_key, source_name, phase, draft_year)"
    pk: [player_key, source_name, phase, draft_year]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: rookie
    columns:
      - { name: player_key, dtype: str, sql_type: text }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: source_name, dtype: str, sql_type: text }
      - { name: source_site, dtype: str, sql_type: text }
      - { name: phase, dtype: str, sql_type: text }
      - { name: draft_year, dtype: Int64, sql_type: integer }
      - { name: global_rank, dtype: Int64, sql_type: integer }
      - { name: positional_rank, dtype: Int64, sql_type: integer }
      - { name: grade, dtype: float64, sql_type: "double precision" }
      - { name: capture_date, dtype: str, sql_type: date }
      - { name: rank_date, dtype: str, sql_type: text }
    edges:
      - { to: dim_rookie_prospect, via: direct, on: player_key }
      - { to: dim_nfl_players, via: direct, on: gsis_id }

  - name: fact_fantrax_adp
    type: fact
    grain: "(scorer_id, season, week)"
    pk: [scorer_id, season, week]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
    chain: fantrax_core
    required_keys: [scorer_id, week]
    columns:
      - { name: scorer_id, dtype: str, sql_type: text }
      - { name: season, dtype: int64, sql_type: integer }
      - { name: week, dtype: str, sql_type: text }
      - { name: capture_date, dtype: str, sql_type: date }
      - { name: player_name, dtype: str, sql_type: text }
      - { name: position_raw, dtype: str, sql_type: text }
      - { name: nfl_team, dtype: str, sql_type: text }
      - { name: is_rookie, dtype: bool, sql_type: boolean }
      - { name: overall_rank, dtype: float64, sql_type: "double precision" }
      - { name: adp, dtype: float64, sql_type: "double precision" }
      - { name: salary, dtype: float64, sql_type: "double precision" }
      - { name: percent_drafted, dtype: float64, sql_type: "double precision" }
      - { name: fpts, dtype: float64, sql_type: "double precision" }
      - { name: fpts_per_game, dtype: float64, sql_type: "double precision" }
      - { name: games_played, dtype: float64, sql_type: integer }
      - { name: age, dtype: float64, sql_type: "double precision" }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: player_key, dtype: str, sql_type: text }
    edges:
      - { to: dim_fantrax_crosswalk, via: direct, on: scorer_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }

  - name: fact_dynasty_ranking_metrics
    type: fact
    grain: "(snapshot_date, source_name, source_player_id, format, metric_key)"
    pk: [snapshot_date, source_name, source_player_id, format, metric_key]
    fk:
      - { columns: [gsis_id], to: dim_nfl_players, ref: [gsis_id] }
      - { columns: [metric_key], to: dim_dynasty_metric, ref: [metric_key] }
    checks:
      - "metric_num IS NOT NULL OR metric_text IS NOT NULL"
    chain: dynasty_profile
    columns:
      - { name: snapshot_date, dtype: "datetime64[us]", sql_type: timestamp }
      - { name: source_name, dtype: str, sql_type: text }
      - { name: source_player_id, dtype: str, sql_type: text }
      - { name: format, dtype: str, sql_type: text }
      - { name: source_uid, dtype: str, sql_type: text }
      - { name: gsis_id, dtype: str, sql_type: text }
      - { name: metric_key, dtype: str, sql_type: text }
      - { name: metric_num, dtype: float64, sql_type: "double precision" }
      - { name: metric_text, dtype: str, sql_type: text }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: dim_dynasty_crosswalk, on: source_uid }
      - { to: dim_dynasty_metric, via: direct, on: metric_key }

# Tables with no parquet file (ADR-0018 decisions 10 and 11, #108). Only the
# migration generator reads this section: the seam, the publish gate and the
# drift check read `tables` alone, so nothing here is writable through the
# seam or checked against a snapshot. An entry has name, schema, columns
# (name + sql_type, no dtype), pk, and optionally required_keys, fk, checks
# and indexes. A column is nullable unless it is in the pk or required_keys.
other_tables:
  - name: etl_run_log
    schema: ops
    pk: [run_id]
    required_keys: [trigger, started_at, status]
    checks:
      - "trigger IN ('daily', 'poll', 'weekly', 'manual')"
      - "status IN ('running', 'failed', 'committed', 'published')"
    columns:
      - { name: run_id, sql_type: uuid }
      - { name: trigger, sql_type: text }
      - { name: started_at, sql_type: timestamptz }
      - { name: finished_at, sql_type: timestamptz }
      - { name: status, sql_type: text }
      - { name: git_sha, sql_type: text }
      - { name: snapshot_commit_sha, sql_type: text }
      - { name: rows_written, sql_type: jsonb }
      - { name: error, sql_type: text }

  - name: change_poll_state
    schema: ops
    pk: [team_key]
    fk:
      - { columns: [team_key], to: dim_fantasy_teams, ref: [team_key] }
    columns:
      - { name: team_key, sql_type: text }
      - { name: period, sql_type: integer }
      - { name: roster_hash, sql_type: text }
      - { name: last_polled_at, sql_type: timestamptz }
      - { name: hash_changed_at, sql_type: timestamptz }
      - { name: pending_since, sql_type: timestamptz }

  - name: review_fantrax_crosswalk
    schema: ops
    pk: [scorer_id, created_at]
    columns:
      - { name: scorer_id, sql_type: text }
      - { name: player_name, sql_type: text }
      - { name: position_raw, sql_type: text }
      - { name: nfl_team, sql_type: text }
      - { name: is_rookie, sql_type: boolean }
      - { name: gsis_id, sql_type: text }
      - { name: player_key, sql_type: text }
      - { name: match_method, sql_type: text }
      - { name: match_score, sql_type: integer }
      - { name: resolved_date, sql_type: date }
      - { name: action, sql_type: text }
      - { name: created_at, sql_type: timestamptz }
      - { name: resolved_at, sql_type: timestamptz }
      - { name: resolution, sql_type: text }

  - name: review_dynasty_crosswalk
    schema: ops
    pk: [source_uid, created_at]
    columns:
      - { name: source, sql_type: text }
      - { name: source_player_id, sql_type: text }
      - { name: source_player_name, sql_type: text }
      - { name: source_position, sql_type: text }
      - { name: source_team, sql_type: text }
      - { name: gsis_id, sql_type: text }
      - { name: player_key, sql_type: text }
      - { name: match_method, sql_type: text }
      - { name: match_score, sql_type: integer }
      - { name: resolved_date, sql_type: date }
      - { name: source_uid, sql_type: text }
      - { name: action, sql_type: text }
      - { name: created_at, sql_type: timestamptz }
      - { name: resolved_at, sql_type: timestamptz }
      - { name: resolution, sql_type: text }

  - name: review_fuzzy_matches
    schema: ops
    pk: [new_name, source, created_at]
    columns:
      - { name: new_name, sql_type: text }
      - { name: new_name_clean, sql_type: text }
      - { name: new_position, sql_type: text }
      - { name: new_school, sql_type: text }
      - { name: best_match_name, sql_type: text }
      - { name: best_match_key, sql_type: text }
      - { name: fuzzy_score, sql_type: integer }
      - { name: action, sql_type: text }
      - { name: source, sql_type: text }
      - { name: created_at, sql_type: timestamptz }
      - { name: resolved_at, sql_type: timestamptz }
      - { name: resolution, sql_type: text }

  - name: review_check
    schema: ops
    pk: [check_name, table_name, row_key, created_at]
    indexes:
      - { name: review_check_one_open_idx, columns: [check_name, table_name, row_key], unique: true, where: "resolved_at IS NULL" }
    columns:
      - { name: check_name, sql_type: text }
      - { name: table_name, sql_type: text }
      - { name: row_key, sql_type: jsonb }
      - { name: detail, sql_type: jsonb }
      - { name: run_id, sql_type: text }
      - { name: created_at, sql_type: timestamptz }
      - { name: last_seen_at, sql_type: timestamptz }
      - { name: pending, sql_type: boolean }
      - { name: resolved_at, sql_type: timestamptz }
      - { name: resolution, sql_type: text }

  - name: owner
    schema: shared
    pk: [owner_id]
    columns:
      - { name: owner_id, sql_type: text }
      - { name: team_key, sql_type: text }
      - { name: human_name, sql_type: text }
      - { name: email, sql_type: text }
      - { name: fantrax_username, sql_type: text }
