# data_model.yml — machine-readable logical-model manifest (SSOT).
#
# Mirrors docs/sources.yml's pattern: this file is the single source of truth
# for the star-schema graph. docs/DATA_MODEL.md renders a Mermaid flowchart
# FROM this file — do not hand-edit the generated region; edit here and run:
#     .\run.ps1 scripts/check_data_model.py --render
#
# Validation (see scripts/check_data_model.py):
#   - schema check (all tables)       : required fields, unique name, valid type
#   - column-drift check (all tables) : declared columns must match the real
#                                       data/{name}.parquet schema (name+dtype)
#   - edge-target check               : every edge.to / edge.via must resolve
#                                       to a table declared in this file
#
# Field notes:
#   name    : table name, PK (== data/{name}.parquet stem)
#   type    : dim | fact | resolver
#             resolver = a bridge/crosswalk table whose whole job is routing
#             identity between other tables (dim_fantrax_crosswalk,
#             dim_dynasty_crosswalk, dim_player_alias, dim_roster_asset) —
#             per .claude/memory/data-model.md, dim_roster_asset explicitly
#             "generalizes the crosswalks one level up".
#   grain   : the natural key (informational — matches the memory doc's
#             documented key, not re-derived from the parquet)
#   columns : list of {name, dtype} — dtype is pandas' dtype string, checked
#             against the real parquet schema by `validate`
#   edges   : outbound relationships: {to: <table>, via: direct|<resolver
#             table name>, on: <join column(s)>}. `via: direct` = joins
#             straight to the target's key. `via: <resolver>` = the real
#             route is through that resolver table, not a direct FK.
#
# Check parameters (ADR-0008 amendment decisions 3, 4, 6, 16; read by
# notebooks/etl_checks.py):
#   chain         : the publish unit that writes this table — fantrax_core |
#                   rookie | dynasty_profile | nflverse. Absent = manual-only
#                   (written by hand-run notebooks, reaches main by PR; the
#                   pipeline never stages it). Steps in run_pipeline.py carry
#                   the same tag.
#   required_keys : columns that must be non-null on every row (the
#                   scorer_id / team_key / period-or-week set, where the table
#                   has them and they are never legitimately null).
#   shrink_limit  : optional; max fractional row-count drop against the last
#                   published snapshot (git HEAD) before the Gate blocks.
#                   Default 0.20. Shrinking to zero rows always blocks.
#   The grain Gate checks uniqueness of `grain` over rows whose grain columns
#   are all non-null; null-key rows file one `grain_null_key` Review finding.

tables:
  # --------------------------------------------------------------- dims
  - name: dim_nfl_players
    type: dim
    grain: gsis_id
    chain: nflverse
    columns:
      - { name: gsis_id, dtype: str }
      - { name: display_name, dtype: str }
      - { name: first_name, dtype: str }
      - { name: last_name, dtype: str }
      - { name: birth_date, dtype: str }
      - { name: status, dtype: str }
      - { name: team_abbr, dtype: str }
      - { name: position, dtype: str }
      - { name: position_group, dtype: str }
      - { name: jersey_number, dtype: str }
      - { name: years_of_experience, dtype: int32 }
      - { name: college_name, dtype: str }
      - { name: college_conference, dtype: str }
      - { name: entry_year, dtype: int32 }
      - { name: last_season, dtype: int32 }
      - { name: draft_year, dtype: float64 }
      - { name: draft_club, dtype: str }
      - { name: draft_round, dtype: float64 }
      - { name: draft_number, dtype: float64 }
      - { name: height, dtype: float64 }
      - { name: weight, dtype: float64 }
      - { name: pfr_id, dtype: str }
      - { name: pff_id, dtype: str }
      - { name: espn_id, dtype: str }
      - { name: esb_id, dtype: str }
      - { name: nfl_id, dtype: str }
      - { name: otc_id, dtype: str }
      - { name: smart_id, dtype: str }
    edges:
      - { to: dim_nfl_teams, via: direct, on: team_abbr }

  - name: dim_rookie_prospect
    type: dim
    grain: player_key
    chain: rookie
    columns:
      - { name: player_key, dtype: str }
      - { name: player_name, dtype: str }
      - { name: player_name_clean, dtype: str }
      - { name: position_raw, dtype: str }
      - { name: position_detail, dtype: str }
      - { name: position_group, dtype: str }
      - { name: side_of_ball, dtype: str }
      - { name: fantasy_relevant, dtype: bool }
      - { name: school_raw, dtype: str }
      - { name: school_canonical, dtype: str }
      - { name: conference, dtype: str }
      - { name: height_inches, dtype: float64 }
      - { name: weight, dtype: float64 }
      - { name: pfr_id, dtype: str }
      - { name: cfb_id, dtype: str }
      - { name: gsis_id, dtype: object }
      - { name: draft_year, dtype: int64 }
      - { name: source, dtype: str }
      - { name: added_date, dtype: str }
    edges:
      - { to: dim_school, via: direct, on: school_raw }
      - { to: dim_position, via: direct, on: position_raw }

  - name: dim_position
    type: dim
    grain: position_raw
    columns:
      - { name: position_raw, dtype: str }
      - { name: position_detail, dtype: str }
      - { name: position_group, dtype: str }
      - { name: position_sort_order, dtype: int64 }
      - { name: side_of_ball, dtype: str }
      - { name: side_of_ball_sort_order, dtype: int64 }
      - { name: fantasy_relevant, dtype: bool }
    edges: []

  - name: dim_school
    type: dim
    grain: school_raw
    columns:
      - { name: school_raw, dtype: str }
      - { name: school_canonical, dtype: str }
      - { name: school_abbr, dtype: str }
      - { name: conference, dtype: str }
    edges: []

  - name: dim_contract
    type: dim
    grain: contract_id
    columns:
      - { name: contract_id, dtype: str }
      - { name: contract_type, dtype: str }
      - { name: contract_label, dtype: str }
      - { name: salary_type, dtype: str }
      - { name: contract_year, dtype: Int64 }
      - { name: total_years, dtype: Int64 }
      - { name: cap_hit_pct, dtype: float64 }
      - { name: guaranteed, dtype: bool }
      - { name: cap_exempt, dtype: bool }
      - { name: min_salary, dtype: float64 }
      - { name: notes, dtype: str }
    edges: []
    notes: >
      11 rows, seeded by 01b. `Minor` is the stage before `1st` (ADR-0019):
      it has no term, so contract_year and total_years are null on that row
      (hence the nullable Int64), and it costs no Dead Money (cap_hit_pct 0,
      not guaranteed). `cap_exempt` is descriptive only: no consumer reads
      it. The one cap exemption is the Minors Roster Slot
      (fact_fantasy_teams.roster_status = "Minors", ADR-0011).

  - name: dim_fantasy_teams
    type: dim
    grain: team_key
    required_keys: [team_key]
    columns:
      - { name: team_key, dtype: str }
      - { name: team_name, dtype: str }
      - { name: team_abbr, dtype: str }
      - { name: fantrax_team_id, dtype: str }
      - { name: conference, dtype: str }
      - { name: division, dtype: str }
      - { name: original_cap, dtype: int64 }
      - { name: reinvestment_cap, dtype: int64 }
    edges:
      - { to: dim_division, via: direct, on: conference }

  - name: dim_nfl_teams
    type: dim
    grain: team_abbr
    columns:
      - { name: team_abbr, dtype: str }
      - { name: team_name, dtype: str }
      - { name: team_id_pfr, dtype: object }
      - { name: team_conf, dtype: str }
      - { name: team_division, dtype: str }
      - { name: team_color, dtype: str }
      - { name: team_color2, dtype: str }
      - { name: team_logo_wikipedia, dtype: str }
      - { name: team_logo_espn, dtype: str }
      - { name: team_wordmark, dtype: str }
      - { name: team_stadium, dtype: object }
    edges: []

  - name: dim_dynasty_metric
    type: dim
    grain: metric_key
    chain: dynasty_profile
    columns:
      - { name: metric_key, dtype: str }
      - { name: metric_label, dtype: str }
      - { name: metric_group, dtype: str }
      - { name: metric_order, dtype: int64 }
      - { name: value_type, dtype: str }
      - { name: direction, dtype: str }
      - { name: source_name, dtype: str }
    edges: []

  - name: dim_pick_value_curve
    type: dim
    grain: "(snapshot_date, source_name, draft_year, round, tier)"
    columns:
      - { name: snapshot_date, dtype: "datetime64[us]" }
      - { name: source_name, dtype: str }
      - { name: draft_year, dtype: int64 }
      - { name: round, dtype: int64 }
      - { name: tier, dtype: str }
      - { name: value, dtype: float64 }
    edges: []

  - name: dim_position_ceiling
    type: dim
    grain: "(snapshot_date, conference, position_group)"
    columns:
      - { name: snapshot_date, dtype: "datetime64[us]" }
      - { name: conference, dtype: str }
      - { name: position_group, dtype: str }
      - { name: pool_size, dtype: int64 }
      - { name: n_rostered, dtype: float64 }
      - { name: n_free_agents, dtype: float64 }
      - { name: max_fpts, dtype: float64 }
      - { name: replacement_fpts, dtype: float64 }
      - { name: best_free_agent, dtype: str }
      - { name: vor, dtype: float64 }
      - { name: ceiling, dtype: float64 }
      - { name: source_season, dtype: int64 }
      - { name: source_week, dtype: str }
    edges: []
    notes: >
      Cross-position scarcity multiplier for mouserat_trade-bud. VOR =
      max_fpts - replacement_fpts, where replacement is the best free agent
      at that position (opportunity cost), computed per 14-team conference
      because the two conferences are separate player pools. conference =
      "ALL" averages the two conferences' vor before rescaling to top = 100,
      and is the row the app reads. position_group is normalized through
      dim_position; not a key join, so no edge.

  - name: fact_draft_pick
    type: fact
    grain: pick_ref
    chain: fantrax_core
    columns:
      - { name: pick_ref, dtype: str }
      - { name: draft_season, dtype: str }
      - { name: round, dtype: int64 }
      - { name: pick_in_round, dtype: int64 }
      - { name: overall_slot, dtype: int64 }
      - { name: original_owner, dtype: str }
      - { name: divisionId, dtype: str }
      - { name: current_owner, dtype: str }
      - { name: is_made, dtype: bool }
      - { name: draft_type, dtype: str }
    edges:
      - { to: dim_season, via: direct, on: "draft_season -> season_id" }
      - { to: dim_fantasy_teams, via: direct, on: "current_owner -> team_key" }
    notes: >
      original_owner is inferred (not sourced from Fantrax -- no such field
      exists in getDraftResults): round 1's own slot assignment is taken as
      the draft order, expanded to later rounds via the snake rule.

  - name: fact_draft_pick_future
    type: fact
    grain: pick_ref
    columns:
      - { name: pick_ref, dtype: str }
      - { name: draft_season, dtype: str }
      - { name: round, dtype: int64 }
      - { name: pick_in_round, dtype: object }
      - { name: overall_slot, dtype: object }
      - { name: original_owner, dtype: str }
      - { name: divisionId, dtype: str }
      - { name: current_owner, dtype: str }
      - { name: is_made, dtype: bool }
      - { name: is_slotted, dtype: bool }
      - { name: draft_type, dtype: str }
    edges:
      - { to: dim_season, via: direct, on: "draft_season -> season_id" }
      - { to: dim_fantasy_teams, via: direct, on: "current_owner -> team_key" }

  - name: dim_season
    type: dim
    grain: season_id
    chain: fantrax_core
    columns:
      - { name: season_id, dtype: str }
      - { name: season_start_year, dtype: int64 }
      - { name: season_end_year, dtype: int64 }
      - { name: season_fantasy_start_date, dtype: "datetime64[ms]" }
      - { name: season_fantasy_end_date, dtype: "datetime64[ms]" }
      - { name: season_nfl_start_date, dtype: "datetime64[ms]" }
      - { name: season_nfl_end_date, dtype: "datetime64[ms]" }
      - { name: theme, dtype: str }
      - { name: relative_nfl_season_number, dtype: int64 }
    edges: []

  - name: dim_division
    type: dim
    grain: "(season_id, conference)"
    chain: fantrax_core
    required_keys: [season_id, conference, division_name]
    columns:
      - { name: season_id, dtype: str }
      - { name: conference, dtype: str }
      - { name: division_name, dtype: str }
    edges:
      - { to: dim_season, via: direct, on: season_id }
    notes: >
      The season's Division name per Conference, from public
      getLeagueInfo.teamInfo[].division (04p; ADR-0016 amendment decision
      12). Each team's Conference comes from dim_fantasy_teams by
      fantrax_team_id. 04p fails, and the Chain is held, unless each Fantrax
      division maps to exactly one Conference and each Conference to one
      division. A run replaces its own season's rows only.

  - name: dim_scoring_period
    type: dim
    grain: "(season_id, period)"
    chain: fantrax_core
    required_keys: [season_id, period, start_date, end_date, start_at, end_at, is_playoff]
    columns:
      - { name: season_id, dtype: str }
      - { name: period, dtype: int64 }
      - { name: start_date, dtype: "datetime64[us]" }
      - { name: end_date, dtype: "datetime64[us]" }
      - { name: start_at, dtype: "datetime64[us, UTC]" }
      - { name: end_at, dtype: "datetime64[us, UTC]" }
      - { name: is_playoff, dtype: bool }
      - { name: update_set_state, dtype: str }
      - { name: closed_at, dtype: "datetime64[us, UTC]" }
    edges:
      - { to: dim_season, via: direct, on: season_id }
    notes: >
      Every Scoring Period of the season (17 in 2026-2027), from public
      getLeagueInfo.scoringPeriods (04p; ADR-0016 amendment decisions 2 and
      14). start_at / end_at are the exact bounds Fantrax serves, stored in
      UTC; start_date / end_date are the same instants as days on the
      league's Eastern clock. Periods turn over on a Thursday evening, so a
      period's end_date equals the next period's start_date: use the
      timestamps to place an instant in a period. is_playoff is true from
      playoffs.firstPlayoffPeriod on. update_set_state is open | closing |
      closed, and null for a playoff period or one that has not started.
      Until the scoring Close checks land (#118, #116) no period is closed,
      so closed_at is all null.

  # ----------------------------------------------------------- resolvers
  - name: dim_fantrax_crosswalk
    type: resolver
    grain: scorer_id
    chain: fantrax_core
    required_keys: [scorer_id]
    columns:
      - { name: scorer_id, dtype: str }
      - { name: player_name, dtype: str }
      - { name: position_raw, dtype: str }
      - { name: nfl_team, dtype: str }
      - { name: is_rookie, dtype: bool }
      - { name: gsis_id, dtype: str }
      - { name: player_key, dtype: str }
      - { name: match_method, dtype: str }
      - { name: match_score, dtype: int64 }
      - { name: resolved_date, dtype: str }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: dim_dynasty_crosswalk
    type: resolver
    grain: source_uid
    chain: dynasty_profile
    columns:
      - { name: source, dtype: str }
      - { name: source_player_id, dtype: str }
      - { name: source_player_name, dtype: str }
      - { name: source_position, dtype: str }
      - { name: source_team, dtype: str }
      - { name: gsis_id, dtype: str }
      - { name: player_key, dtype: str }
      - { name: match_method, dtype: str }
      - { name: match_score, dtype: int64 }
      - { name: resolved_date, dtype: str }
      - { name: source_uid, dtype: str }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: dim_player_alias
    type: resolver
    grain: "(name_clean, position_raw)"
    chain: rookie
    columns:
      - { name: name_clean, dtype: str }
      - { name: position_raw, dtype: str }
      - { name: player_key, dtype: str }
      - { name: decision, dtype: str }
      - { name: source_example, dtype: str }
      - { name: decided_date, dtype: str }
    edges:
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: dim_roster_asset
    type: resolver
    grain: asset_id
    chain: fantrax_core
    columns:
      - { name: asset_id, dtype: int64 }
      - { name: asset_type, dtype: str }
      - { name: scorer_id, dtype: str }
      - { name: gsis_id, dtype: str }
      - { name: player_key, dtype: str }
      - { name: pick_ref, dtype: object }
    edges:
      - { to: dim_fantrax_crosswalk, via: direct, on: scorer_id }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }
      - { to: fact_draft_pick, via: direct, on: pick_ref }

  # --------------------------------------------------------------- facts
  - name: fact_nfl_combine_pro_day_metrics
    type: fact
    grain: "(pfr_id, season)"
    columns:
      - { name: pfr_id, dtype: str }
      - { name: season, dtype: int32 }
      - { name: gsis_id, dtype: str }
      - { name: player_key, dtype: str }
      - { name: is_current_season, dtype: bool }
      - { name: cfb_id, dtype: str }
      - { name: player_name, dtype: str }
      - { name: pos, dtype: str }
      - { name: school, dtype: str }
      - { name: draft_team, dtype: str }
      - { name: draft_round, dtype: float64 }
      - { name: draft_ovr, dtype: float64 }
      - { name: metric_source, dtype: str }
      - { name: height_inches, dtype: float64 }
      - { name: weight, dtype: float64 }
      - { name: forty_yard, dtype: float64 }
      - { name: ten_split, dtype: object }
      - { name: bench_press, dtype: float64 }
      - { name: vertical_jump, dtype: float64 }
      - { name: broad_jump, dtype: float64 }
      - { name: three_cone, dtype: float64 }
      - { name: shuttle, dtype: float64 }
      - { name: hand_size, dtype: object }
      - { name: arm_length, dtype: object }
      - { name: wingspan, dtype: object }
    edges:
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }

  - name: fact_fantasy_teams
    type: fact
    grain: "(team_key, gsis_id)"
    chain: fantrax_core
    required_keys: [team_key]
    columns:
      - { name: team_key, dtype: str }
      - { name: gsis_id, dtype: str }
      - { name: player_key, dtype: str }
      - { name: contract_id, dtype: str }
      - { name: contract_value, dtype: float64 }
      - { name: contract_year, dtype: float64 }
      - { name: status, dtype: str }
      - { name: acquired_method, dtype: str }
      - { name: roster_status, dtype: str }
      - { name: season, dtype: str }
    edges:
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_rookie_prospect, via: direct, on: player_key }
      - { to: dim_contract, via: direct, on: contract_id }

  - name: fact_roster_transactions
    type: fact
    grain: "(season_id, event_type, team_key, asset_id, event_seq)"
    chain: fantrax_core
    required_keys: [team_key]
    columns:
      - { name: season_id, dtype: str }
      - { name: event_type, dtype: str }
      - { name: team_key, dtype: str }
      - { name: asset_id, dtype: int64 }
      - { name: event_seq, dtype: int64 }
      - { name: event_date, dtype: "datetime64[us]" }
      - { name: contract_id, dtype: str }
      - { name: contract_year, dtype: float64 }
      - { name: contract_value, dtype: float64 }
      - { name: cap_hit, dtype: float64 }
      - { name: dead_money, dtype: int64 }
      - { name: status, dtype: str }
      - { name: scorer_id, dtype: str }
      - { name: gsis_id, dtype: str }
      - { name: draft_round, dtype: float64 }
      - { name: pick_in_round, dtype: float64 }
      - { name: pick_overall, dtype: float64 }
      - { name: source, dtype: str }
    edges:
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_roster_asset, via: direct, on: asset_id }
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_contract, via: direct, on: contract_id }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      contract_id is observed, never derived (ADR-0019 decision 6): 02d reads
      it off fact_roster_state, by the Scoring Period Fantrax says the move
      takes effect in. A draft pick (period 1) and a claim read the first
      Roster State inside the stint they start: from the move's period up to
      the period the copy next leaves that team in. A trade and a drop read
      the latest one inside the stint, before the move's period. With no such
      row the contract defaults to `Minor` for a player listed in the
      fact_minor_eligibility capture on either side of the move, else the
      contract the copy already held, else `1st` (draft) or `FA` (claim).
      contract_year follows dim_contract, so it is null on a `Minor` row.
      contract_value on a draft pick or a claim is the salary on the
      fact_preseason_salary capture when it was taken inside the stint the
      move starts (after the move day, before the copy next left that team),
      else the salary on that first Roster State. With neither, a draft pick
      takes the fact_fantrax_adp salary of the draft's own season (the latest
      capture on or before the pick day, else the earliest after it, never
      below the league minimum; the league minimum when the season has no
      capture), and a claim takes the salary the copy held this season in
      this Conference, else the league minimum. A trade and a drop carry the
      copy's salary (#125, #117).
      cap_hit is read by nothing (#97 replaces it).

  - name: fact_trade_log
    type: fact
    grain: "(transaction_id, asset_kind, scorer_id, draft_year, draft_round, pick_in_round)"
    chain: fantrax_core
    required_keys: [team_key_from, team_key_to, week]
    columns:
      - { name: transaction_id, dtype: str }
      - { name: asset_kind, dtype: str }
      - { name: team_key_from, dtype: str }
      - { name: team_key_to, dtype: str }
      - { name: event_date, dtype: "datetime64[us]" }
      - { name: week, dtype: str }
      - { name: scorer_id, dtype: str }
      - { name: gsis_id, dtype: str }
      - { name: draft_round, dtype: float64 }
      - { name: pick_in_round, dtype: float64 }
      - { name: draft_year, dtype: float64 }
      - { name: pick_owner_hint, dtype: str }
      - { name: source, dtype: str }
    edges:
      - { to: dim_fantasy_teams, via: direct, on: "team_key_from, team_key_to -> team_key" }
      - { to: dim_fantrax_crosswalk, via: direct, on: scorer_id }
      - { to: dim_nfl_players, via: direct, on: gsis_id }
    notes: >
      One row per asset moved in a trade (player rows carry scorer_id; pick
      rows carry draft_year/draft_round/pick_in_round), so no grain column is
      non-null on every row: the grain Gate files every row as
      grain_null_key until #109 gives the table an asset_id key.

  - name: fact_roster_state
    type: fact
    grain: "(season_id, period, team_key, scorer_id)"
    chain: fantrax_core
    required_keys: [season_id, period, team_key, scorer_id, roster_slot, salary, contract_id, capture_date]
    columns:
      - { name: season_id, dtype: str }
      - { name: period, dtype: int64 }
      - { name: team_key, dtype: str }
      - { name: scorer_id, dtype: str }
      - { name: roster_slot, dtype: str }
      - { name: salary, dtype: float64 }
      - { name: contract_id, dtype: str }
      - { name: capture_date, dtype: "datetime64[us]" }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_contract, via: direct, on: contract_id }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      The Roster State of each regular-season Scoring Period: one row per
      player copy on a team, from public getTeamRosters?period=N (04r; no
      login; ADR-0016 decision 3 and its amendment, decisions 3 and 14).
      Players are keyed by scorer_id only. roster_slot is Starter | Bench |
      IR | Minors (Fantrax ACTIVE | RESERVE | INJURED_RESERVE | MINORS).
      salary and contract_id are what Fantrax shows on the roster row.
      capture_date is the day, on the league's Eastern clock, the period was
      last read; a period moves until its lineup lock and is frozen after.
      A run reads every period that
      has started and is not closed, up to the period Fantrax calls current,
      and replaces each one whole. Fantrax answers a request for a future
      period with the current roster, so no period is read before the
      calendar and Fantrax both say it has started. Gates: all 28 teams (14
      per Conference) in the newest period, and every contract_id in
      dim_contract. salary is rounded to the cent (the API serves some
      whole-dollar salaries a float hair off). A period's roster is the
      roster at that period's lineup lock: it shows every move Fantrax stamps
      for that period or earlier. Read by 02d (each move's contract and
      salary), 02e (roster_status, from the newest period) and 04e (who is
      rostered).

  - name: fact_period_scoring
    type: fact
    grain: "(season_id, period, team_key, scorer_id)"
    chain: fantrax_core
    required_keys: [season_id, period, team_key, scorer_id, is_starter, fpts, fpts_offense, fpts_defense, fpts_special_teams, capture_date]
    columns:
      - { name: season_id, dtype: str }
      - { name: period, dtype: int64 }
      - { name: team_key, dtype: str }
      - { name: scorer_id, dtype: str }
      - { name: is_starter, dtype: bool }
      - { name: fpts, dtype: float64 }
      - { name: fpts_offense, dtype: float64 }
      - { name: fpts_defense, dtype: float64 }
      - { name: fpts_special_teams, dtype: float64 }
      - { name: capture_date, dtype: "datetime64[us]" }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: fact_roster_state, via: direct, on: "season_id, period, team_key, scorer_id" }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      Period Scoring: the fantasy points of each rostered player in each
      regular-season Scoring Period, per team, split by Unit (04s, from the
      logged-in getLiveScoringStats with the bench view; ADR-0016 amendment
      decisions 1 and 5, ADR-0017 decision 2). One row per player with a
      live-scoring entry; a rostered player with no entry gets no row (no
      zero-fill). fpts is the player's total as Fantrax serves it. The three
      Unit columns are his stats' points summed by Unit: a stat's group is
      Offense or Defense, and the return-yards and blocked-kick categories
      are Special Teams in either group. is_starter is true when Fantrax
      lists the player under ACTIVE; only Starters count toward the Team
      Score. A period loads once its games are final (allEventsFinished),
      even while its Update-Set is still open, and is replaced whole on
      every run until it is closed. capture_date is the Eastern day the raw
      capture was written. The load fails unless every team's Starter points
      sum to the totalFpts Fantrax serves. Gates: the Units sum to fpts
      (0.01); every row is on that period's fact_roster_state, with
      is_starter true exactly when its Roster Slot is Starter.

  - name: fact_matchup
    type: fact
    grain: "(season_id, period, team_key)"
    chain: fantrax_core
    required_keys: [season_id, period, team_key, opponent_team_key, is_home, fpts_for, fpts_against, capture_date]
    columns:
      - { name: season_id, dtype: str }
      - { name: period, dtype: int64 }
      - { name: team_key, dtype: str }
      - { name: opponent_team_key, dtype: str }
      - { name: is_home, dtype: bool }
      - { name: fpts_for, dtype: float64 }
      - { name: fpts_against, dtype: float64 }
      - { name: capture_date, dtype: "datetime64[us]" }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_scoring_period, via: direct, on: "season_id, period" }
      - { to: dim_fantasy_teams, via: direct, on: "team_key, opponent_team_key -> team_key" }
    notes: >
      Matchups: one row per team per regular-season Scoring Period, so each
      matchup is two mirrored rows (04s, from the logged-in getStandings
      view=SCHEDULE; ADR-0016 amendment decision 9). fpts_for and
      fpts_against are the two Team Scores as the schedule shows them; win,
      loss or tie is derived from them, not stored. is_home is the side the
      schedule lists the team on. Holds loaded periods only: a period loads
      with its Period Scoring, once its games are final, and is replaced
      whole on every run until it is closed. The future schedule is not
      stored. The load fails unless the week's matchups hold every team
      once. Gate: every row mirrors its opponent's row (sides and scores
      swapped).

  - name: fact_preseason_salary
    type: fact
    grain: "(season_id, team_key, scorer_id)"
    required_keys: [season_id, team_key, scorer_id, salary, capture_date]
    columns:
      - { name: season_id, dtype: str }
      - { name: team_key, dtype: str }
      - { name: scorer_id, dtype: str }
      - { name: salary, dtype: float64 }
      - { name: capture_date, dtype: "datetime64[us]" }
    edges:
      - { to: dim_season, via: direct, on: season_id }
      - { to: dim_fantasy_teams, via: direct, on: team_key }
      - { to: dim_nfl_players, via: dim_fantrax_crosswalk, on: scorer_id }
      - { to: dim_rookie_prospect, via: dim_fantrax_crosswalk, on: scorer_id }
    notes: >
      Frozen. The salary of every player copy on a roster in the 2026-07-18
      preseason capture, copied once from the retired fact_roster_placement
      (#117). It keeps the salary of a draft pick or a claim that
      left its team before Scoring Period 1, which fact_roster_state cannot
      show. Salary only: the preseason capture is never read for a contract
      (ADR-0019 decision 6). No step writes it and it has no Chain; a later
      season's rows would arrive by PR.

