# sources.yml — machine-readable external-input manifest (SSOT).
#
# This file is the single source of truth for every place data crosses into the
# repo from outside. SOURCES.md renders its tables FROM this file — do not
# hand-edit the generated table regions in SOURCES.md; edit here and run:
#     .\run.ps1 scripts/check_sources.py --render
#
# Validation (see scripts/check_sources.py):
#   - schema check (all sources)            : required fields, unique id, valid status
#   - notebook-exists + token-match (live)  : each feeds[].notebook exists and
#                                             contains >=1 match token (OR)
#   - reverse-drift (WARN)                  : notebook external hosts not registered
#                                             here and not in ignore_hosts
#   - terms block (all sources)             : required and shape-checked (ADR-0022);
#                                             one ADVISORY count for sources never
#                                             checked or past next_check (never a
#                                             failure)
#
# Field notes:
#   id       : stable slug, primary key (never rendered)
#   name     : display -> SOURCES.md "Source" column
#   status   : live | planned   (lint enforces notebook+token on live only)
#   locator  : human URL/locator for the rendered table
#   auth     : METHOD only — never a token/password/email/key (secrets rule)
#   feeds    : list of {notebook, table}; lint asserts token in EACH notebook
#   match    : token(s) the lint searches for in feed notebooks (case-insensitive
#              substring, OR across the list). Internal — never rendered.
#   terms    : the source's terms and licence record (ADR-0022). Its `status`
#              (unresolved | permitted | rejected) is the terms verdict, separate
#              from the manifest `status` above.
#                status, checked, access      always. checked is a date or null.
#                checked_in, how, licence,    required once checked is a date.
#                share_alike
#                documents / not_found        new shape (ADR-0022 amendment, #454); a
#                                             checked block needs one of them, or the
#                                             old `evidence` until it is re-cited.
#                                             Both together is a failure.
#                  documents[]                {kind, url, reached_from {page, place,
#                                             link_text}, read, page_date, read_by,
#                                             method, unread, archive, capture_sha256,
#                                             clauses [{section, topic, verbatim, quote}]}.
#                                             kind: terms | api_terms | licence | privacy |
#                                             copyright. place: footer | menu | sitemap |
#                                             legal_hub | linked_from_doc | operator_domain
#                                             | robots_txt | api_docs | owner_supplied.
#                                             read_by: agent | owner | script. method:
#                                             http_get | browser_render | owner_paste.
#                                             unread: null | js_rendered | refused_status |
#                                             robots_blocks_agent | login | paywall | dns |
#                                             tool_refused | rate_limited.
#                  not_found[]                {kind, looked, date, by}; looked is a
#                                             non-empty list of places.
#                signals, operator            signals {robots {url, code, read, ...},
#                                             tdmrep, x_robots_tag, meta_robots}; a new-shape
#                                             checked block needs signals.robots.code.
#                                             operator is text or null.
#                evidence                     old shape: a list of {url, archive}
#                                             (archive: a web.archive.org copy or null).
#                                             Valid until re-cited; counted by the re-cite
#                                             advisory.
#                attribution, upstream,       optional. upstream is a list of source ids
#                permission                   or names; permission is null (never asked)
#                                             or {asked, given, link}.
#              access: public_get | api_key | owner_login | manual_file | none.
#              next_check = the 1st of the first CFG.source_check_month month (May by
#              default) after `checked`, computed, never typed.
#   security : optional, beside `terms`. The dated per-host security check
#              (ADR-0022): {checked, host, controls, safe_browsing, dns, tls, hsts,
#              registered, flags, confirmed {by, date}}. Needed for a live or planned
#              source read over HTTP (access not manual_file); confirmed.date is needed
#              for live. Its next check follows the same rule as `terms`.

# Hosts that legitimately appear in notebooks but are NOT data sources.
# The reverse-drift check subtracts these (plus registered source hosts).
# Populate when a new non-source host is flagged; keep alphabetized.
ignore_hosts:
  - github.com
  - githubusercontent.com

sources:
  # ---------------------------------------------------------------- live
  # RETIRED 2026-07-31: the `getDraftRanks` board. Fantrax kills that method once
  # the startup draft completes, so 04a's live path is the Players grid
  # (`getPlayerStats`, main_snapshot). The getDraftRanks code left in 04a is
  # replay-only for archived raw JSON — it is no longer an external source.
  # (id was fantrax_getdraftranks until the #83 truth-up.)
  - id: fantrax_playerstats_grid
    name: "Fantrax — getPlayerStats (Players grid)"
    status: live
    terms: &fantrax_terms
      status: unresolved
      checked: 2026-11-07
      checked_in: "#421 (issuecomment-6710339213)"
      how:
        - "terms read in a browser by the planner; the page shows no date"
        - "8.6(c) allows published interfaces only (fxea is one; fxpa/req is not)"
        - "8.6(a) bars non-public areas"
        - "8.6(g) bars crawling and scraping"
        - "8.7 bars showing its information on another website without authorization"
        - "path to compliance: spike #428, fallback #429 (owner, Q13)"
      evidence:
        - { url: "https://www.fantrax.com/terms-of-service", archive: null }
        - { url: "https://github.com/benjamininja/Python-PowerBI-DynastyFantasyFootball/issues/421#issuecomment-6710339213", archive: null }
      licence: site terms
      attribution: null
      share_alike: false
      upstream: []
      access: owner_login
      permission: null
    locator: "https://www.fantrax.com/fxpa/req?leagueId=v744203wmmvjqzv6 (method getPlayerStats; getDraftRanks retired 2026-07-31)"
    purpose: "Full active-roster universe: FPts, FP/G, GP, ADP, %D, salary. Codes: `PROJECTION_0_23l_SEASON` (preseason), `SEASON_23l_YEAR_TO_DATE` (in-season / YTD), `SEASON_23l_BY_DATE` + ISO startDate/endDate (rebuild a missed week, `--rebuild-week`)"
    auth: "Fantrax account login, env-stored (FANTRAX_EMAIL/FANTRAX_PASSWORD); persistent Playwright profile (data/.pw_profile/)"
    cadence: "Weekly (Windows Task Scheduler)"
    feeds:
      - { notebook: 04a_fantrax_weekly_scrape.py, table: fact_fantrax_adp }
    # Method fingerprint, not the league id: 04a still carries the league id in
    # its retired getDraftRanks code, so the id alone would not prove the live
    # Players-grid call is still there.
    match: ["getPlayerStats"]

  - id: fantrax_minor_contracts
    name: "Fantrax — getPlayerStats (MINOR_FANTASY filters)"
    status: live
    terms: *fantrax_terms
    locator: "https://www.fantrax.com/fxpa/req?leagueId=v744203wmmvjqzv6 (method getPlayerStats statusOrTeamFilter=MINOR_FANTASY_AVAILABLE|TAKEN)"
    purpose: "Minors eligibility (read-only): the site's own verdict on who is minors-eligible (GP<=19). 02d reads it for the `Minor` default when no Roster State row covers a move (ADR-0019). Roster Slots, salaries and contracts come from the public getTeamRosters entry below, not from here"
    auth: "Same Fantrax session as the Players-grid source (04v imports 04a's scraper; note: lean-import reuse means check_sources.py's host scan won't flag this file — keep this entry current by hand)"
    cadence: "Weekly (Windows Task Scheduler, after 04a)"
    feeds:
      - { notebook: 04v_minor_contracts.py, table: fact_minor_eligibility }
    # 04v reuses 04a's CFG, so the league id never appears in its source —
    # match on the filter enum that defines this feed instead.
    match: ["MINOR_FANTASY"]

  # 04w / 04t are capture-only scripts: they write verbatim JSON to data/raw/
  # and 02d parses it into the tables. Both notebooks are listed so the lint
  # trips if EITHER side stops referencing the method (02d carries the method
  # name as its SOURCE / TRADE_SOURCE constant).
  - id: fantrax_getdraftresults
    name: "Fantrax — getDraftResults"
    status: live
    terms: *fantrax_terms
    locator: "https://www.fantrax.com/fxpa/req?leagueId=v744203wmmvjqzv6 (methods getDraftResults + getFantasyLeagueInfo + getRefObject FantasyDraftPickType; one call per division)"
    purpose: "Live-draft made-pick attribution: every slot of the startup draft board per division -> `startup_draft` events in the event-sourced ledger, the pick grid and the asset bridge (ADR-0003/0004)"
    auth: "Same Fantrax session as the Players-grid source (04w imports 04a's scraper: env-stored login + persistent Playwright profile)"
    cadence: "Live draft only — re-run between picks + on settle (never scheduled)"
    feeds:
      - { notebook: 04w_fantrax_draft_results.py, table: "(raw capture: data/raw/fantrax_draftresults_{season}_{divisionId}.json)" }
      - { notebook: 02d_fact_roster_transactions.py, table: fact_roster_transactions }
      - { notebook: 02d_fact_roster_transactions.py, table: fact_draft_pick }
      - { notebook: 02d_fact_roster_transactions.py, table: dim_roster_asset }
    match: ["getDraftResults"]

  - id: fantrax_transaction_history
    name: "Fantrax — getTransactionDetailsHistory"
    status: live
    terms: *fantrax_terms
    locator: "https://www.fantrax.com/fxpa/req?leagueId=v744203wmmvjqzv6 (method getTransactionDetailsHistory; team=ALL, views TRADE + CLAIM_DROP, all pages)"
    purpose: "Roster Moves log (trade legs, claims, drops) -> ledger `trade` / `trade_away` / `claim` / `drop` events + the per-asset trade log (players and picks). No public fxea equivalent exists"
    auth: "Same Fantrax session as the Players-grid source (04t imports 04a's scraper: env-stored login + persistent Playwright profile)"
    cadence: "Manual run today (not in run_pipeline.py); ADR-0016 moves it to a full-season pull on every Change Poll trigger + the daily run"
    feeds:
      - { notebook: 04t_fantrax_transaction_history.py, table: "(raw capture: data/raw/fantrax_txn_history_{season}.json)" }
      - { notebook: 02d_fact_roster_transactions.py, table: fact_roster_transactions }
      - { notebook: 02d_fact_roster_transactions.py, table: fact_trade_log }
    match: ["getTransactionDetailsHistory"]

  - id: fantrax_public_fxea
    name: "Fantrax — public fxea API (getDraftPicks)"
    status: live
    terms: &fantrax_fxea_terms
      <<: *fantrax_terms
      access: public_get
      how:
        - "terms read in a browser by the planner; the page shows no date"
        - "8.6(c) allows published interfaces only (fxea is one; fxpa/req is not)"
        - "8.6(a) bars non-public areas"
        - "8.6(g) bars crawling and scraping"
        - "8.7 bars showing its information on another website without authorization"
        - "path to compliance: spike #428, fallback #429 (owner, Q13)"
        - "fxea calls documented at fantrax.com/developer (API v1.8, beta)"
      evidence:
        - { url: "https://www.fantrax.com/terms-of-service", archive: null }
        - { url: "https://www.fantrax.com/developer", archive: null }
        - { url: "https://github.com/benjamininja/Python-PowerBI-DynastyFantasyFootball/issues/421#issuecomment-6710339213", archive: null }
    locator: "https://www.fantrax.com/fxea/general/getDraftPicks?leagueId=v744203wmmvjqzv6"
    purpose: "Real per-pick ownership of every future rookie-draft pick (`futureDraftPicks`, incl. executed pick-for-pick trades)"
    auth: "None (public unauthenticated REST; plain requests, no Playwright session)"
    cadence: "Manual run (not in run_pipeline.py)"
    feeds:
      - { notebook: 04u_fantrax_public_api.py, table: fact_draft_pick_future }
    match: ["getDraftPicks"]

  - id: fantrax_public_league_info
    name: "Fantrax — public fxea API (getLeagueInfo)"
    status: live
    terms: *fantrax_fxea_terms
    locator: "https://www.fantrax.com/fxea/general/getLeagueInfo?leagueId=v744203wmmvjqzv6"
    purpose: "The season's 17 Scoring Periods with their exact bounds (`scoringPeriods`, `playoffs`) and each team's division (`teamInfo`). Feeds the period dim, with the Update-Set state of each regular-season period, and the Division name per Conference (ADR-0016 amendment decisions 2, 12, 14). Also holds the league's scoring rules (`scoringSystem.scoringCategorySettings`: points per unit by category and position), which feed the rules dim (#473 brief 2, ADR-0023). Errors come back as HTTP 200 with an `error` object; `etl_helpers.fantrax_public_get` checks the body"
    auth: "None (public unauthenticated REST; plain requests, no Playwright session)"
    cadence: "Every pipeline run, all phases (`04p_league_info` step, fantrax_core Chain)"
    feeds:
      - { notebook: 04p_fantrax_league_info.py, table: dim_scoring_period }
      - { notebook: 04p_fantrax_league_info.py, table: dim_division }
      - { notebook: 04p_fantrax_league_info.py, table: dim_fantrax_scoring_rule }
    match: ["getLeagueInfo"]

  - id: fantrax_public_rosters
    name: "Fantrax — public fxea API (getTeamRosters per period)"
    status: live
    terms: *fantrax_fxea_terms
    locator: "https://www.fantrax.com/fxea/general/getTeamRosters?leagueId=v744203wmmvjqzv6&period=N"
    purpose: "The Roster State of each regular-season Scoring Period: every player copy's Roster Slot (`status`), salary and contract, per team (ADR-0016 decision 3 and its amendment). A call with no period returns the current one and echoes its number. A past period returns its roster as it stood at that period's lineup lock; a FUTURE period returns the current roster under the future number, so 04r never asks past the current period. One call per period that has started and is not closed. The season comes from a getLeagueInfo call, so a league id carried into a new season cannot write under the old one"
    auth: "None (public unauthenticated REST; plain requests, no Playwright session)"
    cadence: "Every pipeline run, all phases (`04r_roster_state` step, fantrax_core Chain); nothing is read before Scoring Period 1 starts"
    feeds:
      - { notebook: 04r_fantrax_roster_state.py, table: fact_roster_state }
    match: ["getTeamRosters"]

  - id: fantrax_inseason_scoring
    name: "Fantrax — getLiveScoringStats + getStandings (per Scoring Period)"
    status: live
    terms: *fantrax_terms
    locator: "https://www.fantrax.com/fxpa/req?leagueId=v744203wmmvjqzv6 (methods getLiveScoringStats {period, playerViewType:'2'} and getStandings {view:'SCHEDULE'}; plus the plain getStandings {view:'COMBINED'} per period, captured raw only)"
    purpose: "Period Scoring and Matchups (ADR-0016 amendment decisions 1, 5, 9, 15). Live scoring with the bench view lists every rostered player with an entry, Starters under `ACTIVE` and Bench, IR and Minors under `BENCH`, each with points per stat; 04s sums them by Unit. The schedule view gives every week's matchups and Team Scores. A period loads once `allEventsFinished` is true. Live scoring echoes no period, and answers for a period that has not started with 28 teams and no entries. Errors come back as HTTP 200 with a `pageError`. The plain COMBINED standings ignore `period`: every reply is the current standings. It is saved raw and never loaded. No standings table is built (ADR-0016 amendment decision 11): rank is derived from `fact_matchup`, % Playoffs is dropped, and the reply's Salary Remaining is #97's to parse from the raw files"
    auth: "Same Fantrax session as the Players-grid source (04s imports 04a's scraper: env-stored login + persistent Playwright profile). `--from-raw` loads from the saved raw files with no browser and no login"
    cadence: "Every INSEASON pipeline run (`04s_scoring` step, after `04r_roster_state`, fantrax_core Chain). Every regular-season period that has started and is not closed is captured and, once final, replaced whole"
    feeds:
      - { notebook: 04s_fantrax_inseason_capture.py, table: fact_period_scoring }
      - { notebook: 04s_fantrax_inseason_capture.py, table: fact_matchup }
    # 04s reuses 04a's CFG, so the league id never appears in its source —
    # match on the method that defines this feed instead.
    match: ["getLiveScoringStats"]

