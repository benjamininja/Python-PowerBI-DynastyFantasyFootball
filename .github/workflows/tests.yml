# Unit + parser tests in clean venvs (ADR-0008 amendment decision 14, #115).
#
# Two jobs, one per requirements file, so a dependency that exists only in a
# developer's .venv fails here instead of in production (a third, storage-pg,
# runs the storage seam's contract on a throwaway Postgres). Parser tests run on
# the committed fixtures in tests/fixtures/fantrax/ -- no network, no
# data/raw. Make "tests" and "bot-tests" required status checks on main
# (Settings -> Branches) once green.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# #715: a newer head on a pull request cancels the older run. The group is the
# PR number; a push to main gets its own group (the run id) and is never
# cancelled. A second push to a PR stops the first run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One output, heavy (#581). False only on a pull request whose every changed
  # path ends in .md or starts with .claude/memory/; any other path, every .yml
  # included (the tests read docs/data_model.yml and docs/sources.yml), makes it
  # true, and so does a push to main. The heavy jobs skip through if:, never a
  # paths filter, so a skipped required check reports as passed. They skip only
  # when scope succeeded and said false (#722): a scope job that fails runs
  # them, and a cancelled run cancels them. The diff reads with renames off, so
  # a moved file counts under its old path too.
  # A second output, pg (#713), gates storage-pg alone. A pg test reads
  # notebooks/, scripts/, docs/data_model.yml, data/*.parquet and
  # supabase/migrations/, and none reads pbi/, mouserat_trade-bud/,
  # discord_bot/ or docs/site/. So pg is false only on a pull request whose every
  # path makes heavy false or starts with one of those four folders. It is a skip
  # list: a new folder runs the job until it is added to the second case in the
  # diff step below.
  scope:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      pg: ${{ steps.diff.outputs.pg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "heavy=true" >> "$GITHUB_OUTPUT"
          echo "pg=true" >> "$GITHUB_OUTPUT"
          heavy=true
          pg=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
            if [ -n "$files" ]; then
              heavy=false
              pg=false
              while IFS= read -r f; do
                case "$f" in
                  *.md | .claude/memory/*) ;;
                  *) heavy=true ;;
                esac
                case "$f" in
                  *.md | .claude/memory/*) ;;
                  pbi/* | mouserat_trade-bud/* | discord_bot/* | docs/site/*) ;;
                  *) pg=true ;;
                esac
              done <<< "$files"
            fi
            echo "$files"
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "pg=$pg" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy pg=$pg"

  tests:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.heavy == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/

  # The storage seam's contract on Postgres (#135, ADR-0014). A throwaway
  # postgres:17 gets the migrations, then the tests connect as etl_writer, the
  # login the scheduled run uses, into a scratch schema it owns. A skipped
  # case fails the job. No secret; nothing here reaches the real project.
  storage-pg:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.pg == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: throwaway-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: throwaway-ci-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply the migrations and give etl_writer a scratch schema
        run: |
          createdb seam_check
          psql -v ON_ERROR_STOP=1 -d seam_check -f tests/sql/auth_stub.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -d seam_check -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -d seam_check -c "ALTER ROLE etl_writer PASSWORD 'throwaway-etl-writer'"
          psql -v ON_ERROR_STOP=1 -d seam_check -c "CREATE SCHEMA seam_contract AUTHORIZATION etl_writer"

      - name: Contract tests on Postgres (a skip fails the job)
        env:
          TEST_DATABASE_URL: postgresql://etl_writer:throwaway-etl-writer@localhost:5432/seam_check
          REQUIRE_TEST_DATABASE: '1'
        run: python -m pytest tests/ -m pg -v -rs --durations=25

  # The data-model, sources and Gate checks the manager used to run by hand at
  # re-proof (#695). No secret, no network: they read the committed yaml, docs
  # and published snapshot.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python scripts/check_data_model.py

      - run: python scripts/check_data_model.py --check

      - run: python scripts/check_sources.py --check

      - run: python scripts/run_pipeline.py --check-only

  bot-tests:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.heavy == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: discord_bot/requirements.txt

      - run: pip install -r discord_bot/requirements.txt

      - run: python -m pytest discord_bot/tests/
