# Schema migrations (#108, ADR-0018). Two jobs. validate (pull request)
# applies supabase/migrations to a throwaway Postgres and tests the result.
# push (merge to main) applies them to the real project with the secret
# SUPABASE_MIGRATE_DB_URL from the etl environment, which is limited to main.
# On a push it holds the first pending migration with a destructive statement,
# and every one after it. Held, anywhere in a statement and in any case: DROP
# (any form), TRUNCATE, DELETE FROM, MERGE, UPDATE ... SET, RENAME,
# ALTER [COLUMN] ... [SET DATA] TYPE, ALTER TYPE, DETACH PARTITION, SET SCHEMA.
# GRANT and REVOKE are not held. Exempt: DROP CONSTRAINT of a name matching
# <table>_chk_[0-9a-f]{8}, directly followed by ADD CONSTRAINT of a name
# matching the same pattern with CHECK, on the same table
# (scripts/migration_gate.py). (#534, ADR-0018 decision 12): those apply only when
# the owner runs this workflow by hand (workflow_dispatch) from main.
name: migrate

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'docs/data_model.yml'
      - 'scripts/generate_migrations.py'
      - 'scripts/migration_gate.py'
      - 'tests/test_migrations_*.py'
      - '.github/workflows/migrate.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'docs/data_model.yml'
      - 'scripts/generate_migrations.py'
      - 'scripts/migration_gate.py'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: throwaway-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: throwaway-ci-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply each migration with psql
        run: |
          createdb apply_check
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -d apply_check -f "$f"
          done

      - name: Test the applied schema (a skip fails the job)
        env:
          TEST_DATABASE_URL: postgresql://postgres:throwaway-ci-password@localhost:5432/apply_check
          REQUIRE_TEST_DATABASE: '1'
        run: python -m pytest tests/test_migrations_apply.py -rs

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      - name: Push with the Supabase CLI to a second throwaway database
        run: |
          createdb cli_check
          supabase db push --yes --db-url "postgresql://postgres:throwaway-ci-password@localhost:5432/cli_check?sslmode=disable"
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(psql -At -d cli_check -c "SELECT count(*) FROM supabase_migrations.schema_migrations")
          echo "migration files: $expected, applied by the CLI: $applied"
          test "$applied" -ge 1
          test "$applied" -eq "$expected"

  push:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: etl
    concurrency:
      group: migrate-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      - name: Install psql
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Hold a destructive migration for the owner's dispatch
        id: gate
        if: github.event_name == 'push'
        env:
          SUPABASE_MIGRATE_DB_URL: ${{ secrets.SUPABASE_MIGRATE_DB_URL }}
        run: |
          psql "$SUPABASE_MIGRATE_DB_URL" -v ON_ERROR_STOP=1 -At -c "SELECT version FROM supabase_migrations.schema_migrations" > "$RUNNER_TEMP/applied.txt"
          python3 scripts/migration_gate.py --applied "$RUNNER_TEMP/applied.txt" --remove >> "$GITHUB_OUTPUT"

      - name: Push the migrations to the real project
        env:
          SUPABASE_MIGRATE_DB_URL: ${{ secrets.SUPABASE_MIGRATE_DB_URL }}
        run: supabase db push --yes --db-url "$SUPABASE_MIGRATE_DB_URL"

      - name: Stop at the held migration
        if: steps.gate.outputs.held != ''
        env:
          HELD: ${{ steps.gate.outputs.held }}
        run: |
          echo "::error::$HELD holds a destructive statement and was not applied. It and every later migration apply when the owner runs migrate by workflow_dispatch from main."
          exit 1
