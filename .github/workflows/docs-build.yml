# Build-only check for the docs site (#374). Runs on pull requests, never
# deploys: read-only token, no pages: write, no secrets. It proves the site
# builds into _site/docs/ beside trade-bud's _site/index.html and leaves that
# file untouched. It also runs on a change under mouserat_trade-bud/, so a
# trade-bud PR gets a build of the static site. The deploy is pages.yml, which
# runs only on main.
#
# Zensical is installed here from docs/site/requirements.txt only; it is not in
# the root requirements.txt.
name: docs-build

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'mkdocs.yml'
      - 'scripts/run_pipeline.py'
      - 'docs/sources.yml'
      - 'mouserat_trade-bud/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trade-bud export dependencies
        run: pip install -r mouserat_trade-bud/backend/requirements.txt

      - name: Install the docs generator
        run: pip install -r docs/site/requirements.txt

      - name: Show the installed Zensical version
        run: python -m pip show zensical

      - name: Build trade-bud into _site
        run: python mouserat_trade-bud/export_static.py --out _site

      - name: Record trade-bud's index.html
        run: sha256sum _site/index.html | tee trade-bud-index.sha256

      - name: Generate the refresh schedule page
        run: python scripts/build_schedule_page.py

      - name: Build the docs site into _site/docs
        run: zensical build --clean

      - name: List _site/docs
        run: find _site/docs -type f | sort

      - name: Check the tab pages exist
        run: |
          for p in index refresh-schedule running-the-pipeline data-sources data-model; do
            if [ "$p" = index ]; then f=_site/docs/index.html; else f=_site/docs/$p/index.html; fi
            test -s "$f" || { echo "missing $f"; exit 1; }
            echo "present $f"
          done

      - name: Check trade-bud's index.html is untouched
        run: sha256sum --check trade-bud-index.sha256

      - name: Check nothing from data/raw or data/review was pulled in
        run: |
          if grep -rIl -e 'data/raw' -e 'data/review' _site/docs; then
            echo "docs output mentions data/raw or data/review"; exit 1
          fi
          echo "clean"
