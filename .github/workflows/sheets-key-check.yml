# A one-minute test of the Sheets secret (#643, Refs #614): writes the key the
# way etl-daily does, signs in through etl_helpers (the path 01c uses) and
# reads the team-manifest tab. It prints ok and a row count, or the one failing
# check, never a value or a cell. No data is written, no PR is opened, no store
# is touched. Manual only, from main. The repository is public, so the run log
# is public too.
name: sheets-key-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: etl
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Write the Sheets key
        env:
          GOOGLE_SHEETS_KEY_JSON: ${{ secrets.GOOGLE_SHEETS_KEY_JSON }}
        run: python scripts/write_sheets_key.py "${RUNNER_TEMP}/sheets-key.json"

      - name: Sign in and read the team-manifest tab
        env:
          GOOGLE_SHEETS_KEY_FILE: ${{ runner.temp }}/sheets-key.json
        run: python scripts/check_sheets_key.py
