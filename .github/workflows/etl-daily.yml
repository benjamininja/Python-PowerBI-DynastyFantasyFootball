# The Daily Run on GitHub Actions (#93, ADR-0015). The same scripts/run_pipeline.py
# the PC task runs, started by scripts/run_daily.sh. The schedule is gated off:
# the cron fires, but the job runs only when the repository variable
# ETL_DAILY_ENABLED is the string true. workflow_dispatch always runs, from main.
# The job reads the etl environment (limited to main). The data PR is opened and
# merged with a short-lived GitHub App token, minted per run from the etl
# variable ETL_APP_CLIENT_ID and the etl secret ETL_APP_PRIVATE_KEY, scoped to
# this repository. The repository is public, so
# the run log is public too: no step echoes a secret or a row value.
name: etl-daily

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ETL_DAILY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: etl
    concurrency:
      group: etl
      cancel-in-progress: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Mint the data-PR token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ETL_APP_CLIENT_ID }}
          private-key: ${{ secrets.ETL_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set the git identity and the push URL
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run the Daily Run
        env:
          FANTRAX_EMAIL: ${{ secrets.FANTRAX_EMAIL }}
          FANTRAX_PASSWORD: ${{ secrets.FANTRAX_PASSWORD }}
          FANTRAX_TOTP_SECRET: ${{ secrets.FANTRAX_TOTP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ETL_STORAGE: ${{ vars.ETL_STORAGE }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/run_daily.sh
