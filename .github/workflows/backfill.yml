# The one-time backfill of the real project (#135, B3; ADR-0014, ADR-0018).
# Loads the published snapshot (data/*.parquet) into the empty football schema
# in ONE transaction as the etl_writer login, reads every table back, compares
# it with the snapshot and commits only if all are equal. Started by the owner
# from the Actions tab and by no one else: workflow_dispatch only, in the etl
# environment (limited to main) that holds SUPABASE_DB_URL. There is no
# --replace input: a re-run on a database that holds rows is refused, and a
# replace run is a later ticket. The output is table names and counts only.
name: backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: etl
    concurrency:
      group: backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Load the snapshot into the football schema
        env:
          ETL_STORAGE: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/backfill_postgres.py
