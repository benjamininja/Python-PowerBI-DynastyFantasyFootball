<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Shareable by link, kept out of search results. The repo is already public,
     so this is about discoverability, not secrecy -- delete to index it. -->
<meta name="robots" content="noindex">
<title>mouserat trade-bud</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f28; --panel2: #242835; --border: #333846;
    --text: #e6e8ee; --muted: #8a90a2; --accent: #5b8cff; --good: #3ecf8e;
    --bad: #ff5c7a; --neutral: #c9a13b;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; padding: 24px; line-height: 1.4;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--text); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 300px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input[type=text] {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 8px; border-radius: 6px; font-size: 13px; margin-bottom: 10px;
  }
  .chip-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip {
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 16px; font-size: 12px; cursor: pointer;
  }
  .chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .signal-line { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .signal-line b { color: var(--text); }
  .helper-panel {
    margin-top: 10px; padding: 10px; background: rgba(201,161,59,0.08);
    border: 1px solid rgba(201,161,59,0.35); border-radius: 8px; font-size: 12px;
  }
  .helper-panel .title { color: var(--neutral); font-weight: 600; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .tag.surplus { background: rgba(62,207,142,0.15); color: var(--good); }
  .tag.need { background: rgba(255,92,122,0.15); color: var(--bad); }
  .tag.neutral { background: rgba(255,255,255,0.08); color: var(--muted); }
  .asset-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .asset-list table { font-size: 12px; }
  .asset-list thead th { position: sticky; top: 0; background: var(--panel); cursor: pointer; }
  .asset-list tbody tr { cursor: pointer; }
  .asset-list tbody tr:hover { background: var(--panel2); }
  .asset-list tbody tr.picked { background: rgba(91,140,255,0.12); }
  .cap-line { font-size: 12px; margin: 2px 0; }
  .cap-line b { color: var(--text); }
  .cap-line .down { color: var(--bad); }
  .cap-line .up { color: var(--good); }
  .cap-inline { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .basket { min-height: 40px; border: 1px dashed var(--border); border-radius: 6px; padding: 8px; font-size: 12px; }
  .basket-item {
    display: flex; justify-content: space-between; padding: 3px 0; color: var(--text);
  }
  .basket-item .x { color: var(--bad); cursor: pointer; }
  .bar-wrap { margin: 14px 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .bar-track { height: 14px; background: var(--panel2); border-radius: 7px; overflow: hidden; display: flex; }
  .bar-give { background: var(--bad); height: 100%; }
  .bar-receive { background: var(--good); height: 100%; }
  .diagnostic { font-size: 14px; margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--panel2); }
  button.primary {
    background: var(--accent); color: white; border: none; padding: 8px 18px;
    border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .config { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .config input { display: inline-block; width: 260px; }
  .tabnav { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
</style>
</head>
<body>

<h1>mouserat presents trade-bud</h1>
<div class="subtitle">Dynasty trade diagnostic.</div>

<div class="config">
  <span id="dataStatus"></span>
</div>

<div class="panel">
  <h2>Teams</h2>
  <div class="row">
    <div class="col">
      <label>My Team</label>
      <select id="myTeam" onchange="onTeamChange('my')"></select>
    </div>
    <div class="col">
      <label>El Otro Equipo (The Other Team)</label>
      <select id="cpTeam" onchange="onTeamChange('counterparty')"></select>
    </div>
  </div>
</div>

<div class="tabnav">
  <div class="tab-btn active" id="navBtn-overview" onclick="showTab('overview')">Positional Overview</div>
  <div class="tab-btn" id="navBtn-analysis" onclick="showTab('analysis')">Trade Analysis</div>
</div>

<!-- TAB 1: league-wide overview -->
<div id="tab-overview" class="tabpage">
  <div class="panel">
    <h2>Positional Overview</h2>
    <div class="chip-row" id="overviewFilterChips"></div>
    <label>Valuing on</label>
    <div class="chip-row" id="overviewStanceChips"></div>
    <div id="overviewWrap" style="overflow-x:auto;"><table id="overviewTable"><thead></thead><tbody></tbody></table></div>
  </div>
</div>

<!-- TAB 2: profiles + two-team overview + build-a-trade -->
<div id="tab-analysis" class="tabpage" style="display:none;">

<div class="row">
  <div class="col panel" id="profileCard-my">
    <h2>My Profile</h2>
    <div id="myProfileBody"></div>
    <div class="cap-inline" id="capCard-my"></div>
  </div>
  <div class="col panel" id="profileCard-counterparty">
    <h2>Counterparty</h2>
    <div id="cpProfileBody"></div>
    <div class="cap-inline" id="capCard-cp"></div>
  </div>
</div>

<div id="analysisSection">
  <div class="panel">
    <h2>Positional Overview</h2>
    <div class="row">
      <div class="col">
        <div class="signal-line" id="posLabel-my"></div>
        <table id="posTable-my"><thead></thead><tbody></tbody></table>
      </div>
      <div class="col">
        <div class="signal-line" id="posLabel-cp"></div>
        <table id="posTable-cp"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Build a Trade</h2>
    <div class="row">
      <div class="col">
        <label id="giveLabel">My team gives</label>
        <div class="asset-list"><table id="giveAssetsTable"><thead></thead><tbody id="giveAssets"></tbody></table></div>
        <label id="giveBasketLabel" style="margin-top:10px;">Give basket</label>
        <div class="basket" id="giveBasket"></div>
      </div>
      <div class="col">
        <label id="receiveLabel">My team receives (from counterparty)</label>
        <div class="asset-list"><table id="receiveAssetsTable"><thead></thead><tbody id="receiveAssets"></tbody></table></div>
        <label id="receiveBasketLabel" style="margin-top:10px;">Receive basket</label>
        <div class="basket" id="receiveBasket"></div>
      </div>
    </div>

    <div class="bar-wrap">
      <div class="bar-label"><span>Give: <span id="giveTotal">0</span></span><span>Receive: <span id="receiveTotal">0</span></span></div>
      <div class="bar-track">
        <div class="bar-give" id="barGive" style="width:50%"></div>
        <div class="bar-receive" id="barReceive" style="width:50%"></div>
      </div>
    </div>
    <div class="diagnostic" id="diagnostic">Add assets to both sides to see the trade diagnostic.</div>
  </div>
</div>

</div>

<script>
let state = {
  teams: [],
  myTeam: null, cpTeam: null,
  myProfile: null, cpProfile: null,
  myAssets: {players: [], picks: []},
  cpAssets: {players: [], picks: []},
  give: [],   // assets from myTeam going to cpTeam
  receive: [], // assets from cpTeam coming to myTeam
  overviewByStance: {},  // stance key -> rows, straight from positional-league.json
  overviewRows: [],      // the currently-selected stance's slice of the above
  overviewStance: 'balanced',
  overviewFilter: { type: 'all', value: null } // 'all' | 'division' | 'team'
};

// Display label -> the stance key the backend values under (data_access.STANCES).
// Contending prices off DraftSharks' redraft board, the other two off the
// dynasty boards.
const STANCE_KEY = { 'Contending': 'contending', 'Balanced': 'balanced', 'Future-Focused': 'future' };

// Asset values arrive as {contending, balanced, future}; every read goes
// through here so there is exactly one place that decides which stance is
// pricing the trade. That is MY team's stance: a Pareto delta is only
// meaningful if both sides are totalled in one currency.
function currentStanceKey() {
  return STANCE_KEY[(state.myProfile || {}).stance] || 'balanced';
}
function assetValue(a) {
  return (a.values && a.values[currentStanceKey()]) || 0;
}

function showTab(name) {
  document.getElementById('tab-overview').style.display = name === 'overview' ? '' : 'none';
  document.getElementById('tab-analysis').style.display = name === 'analysis' ? '' : 'none';
  document.getElementById('navBtn-overview').classList.toggle('active', name === 'overview');
  document.getElementById('navBtn-analysis').classList.toggle('active', name === 'analysis');
}

// Cache by file, not by call: profiles.json holds all 56 profiles, so the
// second mode of a team is already in hand. Promises (not results) are cached
// so two concurrent callers share one request rather than racing.
const _fileCache = {};
function fetchJson(rel) {
  if (!(rel in _fileCache)) {
    _fileCache[rel] = fetch(`data/${rel}`).then(res => {
      if (!res.ok) throw new Error(`${rel} -> ${res.status}`);
      return res.json();
    });
  }
  return _fileCache[rel];
}

// This app is served as static JSON precomputed from the repo's committed
// parquet by mouserat_trade-bud/export_static.py -- there is no backend.
// api() keeps the original endpoint paths as its calling convention so every
// call site below is unchanged; it just resolves them to files.
async function api(path) {
  const [route, query] = path.split('?');
  if (route === '/teams') return fetchJson('teams.json');
  if (route === '/positional-strength/league') return fetchJson('positional-league.json');

  const m = route.match(/^\/teams\/([^/]+)\/(profile|assets)$/);
  if (m) {
    const [, teamKey, kind] = m;
    if (kind === 'assets') return fetchJson(`assets/${encodeURIComponent(teamKey)}.json`);
    const mode = new URLSearchParams(query || '').get('mode') || 'my';
    const profile = (await fetchJson('profiles.json'))[teamKey];
    if (!profile || !profile[mode]) throw new Error(`no profile for ${teamKey}/${mode}`);
    return profile[mode];
  }
  throw new Error(`no static payload for ${path}`);
}

async function init() {
  const statusEl = document.getElementById('dataStatus');
  let meta;
  try {
    meta = await fetchJson('meta.json');
  } catch (e) {
    statusEl.textContent = '● could not load data files';
    statusEl.style.color = '#ff5c7a';
    return;
  }
  const when = new Date(meta.generated_at);
  statusEl.textContent = '● Data as of ' + (isNaN(when) ? meta.generated_at : when.toLocaleString());
  statusEl.style.color = '#8a90a2';
  state.teams = await api('/teams');
  const myTeamSel = document.getElementById('myTeam');
  const opts = teams => teams.map(t => `<option value="${t.team_key}">${t.team_name} (${t.team_abbr})</option>`).join('');
  myTeamSel.innerHTML = '<option value="">-- select --</option>' + opts(state.teams);
  refreshCpOptions();
  loadOverview();
}

// Counterparty picker only offers teams sharing myTeam's conference (Phase A #4's
// rule is also re-checked in evaluateTradeLocal(); this is the matching UI).
function refreshCpOptions() {
  const cpTeamSel = document.getElementById('cpTeam');
  const prev = cpTeamSel.value;
  const myTeamObj = state.teams.find(t => t.team_key === state.myTeam);
  // Same conference as myTeam, and never myTeam itself (a team can't trade with itself).
  const candidates = myTeamObj
    ? state.teams.filter(t => t.conference === myTeamObj.conference && t.team_key !== myTeamObj.team_key)
    : state.teams;
  const opts = candidates.map(t => `<option value="${t.team_key}">${t.team_name} (${t.team_abbr})</option>`).join('');
  cpTeamSel.innerHTML = '<option value="">-- select --</option>' + opts;
  if (candidates.some(t => t.team_key === prev)) {
    cpTeamSel.value = prev;
  } else if (prev) {
    state.cpTeam = null;
    state.cpProfile = null;
    document.getElementById('cpProfileBody').innerHTML = '';
  }
}

function onTeamChange(mode) {
  const teamKey = mode === 'my' ? document.getElementById('myTeam').value : document.getElementById('cpTeam').value;
  if (mode === 'my') {
    state.myTeam = teamKey || null;
    state.give = [];
    refreshCpOptions();
  } else {
    state.cpTeam = teamKey || null;
    state.receive = [];
  }
  const division = teamKey ? (state.teams.find(t => t.team_key === teamKey) || {}).division : null;
  setOverviewFilter(division ? 'division' : 'all', division || null);
  if (teamKey) loadProfile(mode);
  renderTwoTeamOverview();
  renderBaskets();
  renderCapCards();
  evaluateTrade();
  if (state.myTeam && state.cpTeam) loadAnalysis();
}

// Filter chips above the league-wide Positional Overview table: All Teams,
// one per division, plus (when set) whichever team was picked via the "My
// Team" selector on the Analysis tab -- selecting a team elsewhere filters
// this table down to that one team, keeping both views in sync.
function renderOverviewFilterChips() {
  const f = state.overviewFilter;
  const divisions = [...new Set(state.teams.map(t => t.division))].sort();
  const chips = [`<div class="chip ${f.type === 'all' ? 'selected' : ''}" onclick="setOverviewFilter('all')">All Teams</div>`];
  divisions.forEach(d => {
    chips.push(`<div class="chip ${f.type === 'division' && f.value === d ? 'selected' : ''}" onclick="setOverviewFilter('division','${d}')">${d}</div>`);
  });
  if (f.type === 'team' && f.value) {
    const t = state.teams.find(t => t.team_key === f.value);
    if (t) chips.push(`<div class="chip selected">${t.team_name}</div>`);
  }
  // Surplus/need is stance-dependent -- a contender's DL depth is not a
  // rebuilder's -- so the table says which board it is ranking on, and lets
  // you switch without leaving the tab.
  const stanceChips = STANCES.map(s => {
    const k = STANCE_KEY[s];
    return `<div class="chip ${k === state.overviewStance ? 'selected' : ''}" onclick="setOverviewStance('${k}')">${s}</div>`;
  }).join('');
  document.getElementById('overviewFilterChips').innerHTML = chips.join('');
  document.getElementById('overviewStanceChips').innerHTML = stanceChips;
}

function setOverviewFilter(type, value) {
  state.overviewFilter = { type, value: value || null };
  renderOverviewFilterChips();
  renderOverviewTable('overviewTable', state.overviewRows, state.teams.map(t => t.team_key));
}

function setOverviewStance(stanceKey) {
  state.overviewStance = stanceKey;
  state.overviewRows = state.overviewByStance[stanceKey] || [];
  renderOverviewFilterChips();
  renderOverviewTable('overviewTable', state.overviewRows, state.teams.map(t => t.team_key));
  renderTwoTeamOverview();
}

async function loadOverview() {
  // positional-league.json is keyed by stance since the valuation redesign;
  // all three ship in one file so switching costs no round trip.
  state.overviewByStance = await api('/positional-strength/league');
  setOverviewStance(state.overviewStance);
}

// Shared renderer: league-wide table uses every team_key; the two-team matchup
// view (renderTwoTeamOverview) reuses the same cached rows/markup, just
// restricted to [myTeam, cpTeam] -- same rank-of-28/tag styling either way.
let overviewSort = { col: 'Team', dir: 1 };

function setOverviewSort(tableId, col) {
  if (overviewSort.col === col) overviewSort.dir *= -1;
  else { overviewSort.col = col; overviewSort.dir = 1; }
  renderOverviewTable(tableId, state.overviewRows, state.teams.map(t => t.team_key));
}

const CAP_COL = 'Cap $ Remaining';

function renderOverviewTable(tableId, rows, teamKeys) {
  const teamName = tk => (state.teams.find(t => t.team_key === tk) || {}).team_name || tk;
  const capFor = tk => {
    const t = state.teams.find(t => t.team_key === tk);
    return t && t.remaining_cap_current_yr != null ? t.remaining_cap_current_yr : null;
  };
  const fmtCap = v => v == null ? '-' : '$' + Math.round(v).toLocaleString();
  const sortOrderFor = {};
  rows.forEach(r => { sortOrderFor[r.position_group] = [r.side_of_ball_sort_order, r.position_sort_order]; });
  const positions = [...new Set(rows.map(r => r.position_group))]
    .sort((a, b) => sortOrderFor[a][0] - sortOrderFor[b][0] || sortOrderFor[a][1] - sortOrderFor[b][1]);
  const byTeam = {};
  rows.forEach(r => {
    byTeam[r.team_key] = byTeam[r.team_key] || {};
    byTeam[r.team_key][r.position_group] = r;
  });
  const rankFor = (tk, p) => { const r = (byTeam[tk] || {})[p]; return r ? r.rank : Infinity; };

  const f = state.overviewFilter || { type: 'all' };
  const filteredKeys = teamKeys.filter(tk => {
    if (f.type === 'division') return (state.teams.find(t => t.team_key === tk) || {}).division === f.value;
    if (f.type === 'team') return tk === f.value;
    return true;
  });

  const thead = document.querySelector(`#${tableId} thead`);
  const cols = ['Team', CAP_COL, ...positions];
  thead.innerHTML = `<tr>${cols.map(c => {
    const arrow = overviewSort.col === c ? (overviewSort.dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th style="cursor:pointer;" onclick="setOverviewSort('${tableId}','${c}')">${c}${arrow}</th>`;
  }).join('')}</tr>`;

  const tbody = document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML = filteredKeys
    .slice()
    .sort((a, b) => {
      let cmp;
      if (overviewSort.col === 'Team') cmp = teamName(a).localeCompare(teamName(b));
      else if (overviewSort.col === CAP_COL) cmp = (capFor(a) ?? -Infinity) - (capFor(b) ?? -Infinity);
      else cmp = rankFor(a, overviewSort.col) - rankFor(b, overviewSort.col);
      return cmp * overviewSort.dir;
    })
    .map(tk => {
      const cells = positions.map(p => {
        const r = (byTeam[tk] || {})[p];
        return r ? `<td><span class="tag ${r.label}">${r.rank}</span></td>` : '<td>-</td>';
      }).join('');
      return `<tr><td>${teamName(tk)}</td><td>${fmtCap(capFor(tk))}</td>${cells}</tr>`;
    }).join('');
}

// Restored from the pre-tab-restructure "Positional Strength" panel: two
// side-by-side per-team tables with explicit rank/28 + the surplus/need/
// neutral word label -- the merged wide table (used for the league-wide tab)
// only carried a bare colored rank number and lost that signal.
//
// Sortable (mirrors overviewSort/assetSort), with an independent sort state
// per side (my/cp), same shape as assetSort's give/receive split. Position
// defaults to the data model's own display order (dim_position.position_sort_order),
// not alphabetical. Count is the multi-position-aware headcount: a
// dual-eligible player (e.g. DL,LB per dim_fantrax_crosswalk.position_raw)
// is counted at every position they qualify for, not just one.
const POS_COLS = [
  { key: 'Pos', get: r => r.position_group, sort: (a, b) => a.side_of_ball_sort_order - b.side_of_ball_sort_order || a.position_sort_order - b.position_sort_order },
  { key: 'Rank', get: r => `${r.rank} / ${r.n_teams}`, sort: (a, b) => a.rank - b.rank },
  { key: 'Count', get: r => r.position_count, sort: (a, b) => a.position_count - b.position_count },
  { key: 'Signal', get: r => `<span class="tag ${r.label}">${r.label}</span>`, sort: (a, b) => a.label.localeCompare(b.label) },
];

let posSort = { my: { col: 'Pos', dir: 1 }, cp: { col: 'Pos', dir: 1 } };

function setPosSort(side, col) {
  const s = posSort[side];
  if (s.col === col) s.dir *= -1; else { s.col = col; s.dir = 1; }
  renderTwoTeamOverview();
}

function renderPositional(side, rows, teamName) {
  const tableId = side === 'my' ? 'posTable-my' : 'posTable-cp';
  document.getElementById(`posLabel-${side}`).textContent = teamName;
  const s = posSort[side];

  const thead = document.querySelector(`#${tableId} thead`);
  thead.innerHTML = `<tr>${POS_COLS.map(c => {
    const arrow = s.col === c.key ? (s.dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th style="cursor:pointer;" onclick="setPosSort('${side}','${c.key}')">${c.key}${arrow}</th>`;
  }).join('')}</tr>`;

  const col = POS_COLS.find(c => c.key === s.col);
  const sorted = rows.slice().sort((a, b) => col.sort(a, b) * s.dir);
  document.querySelector(`#${tableId} tbody`).innerHTML = sorted.map(r => `
    <tr>${POS_COLS.map(c => `<td>${c.get(r)}</td>`).join('')}</tr>
  `).join('');
}

function renderTwoTeamOverview() {
  const myTeam = state.teams.find(t => t.team_key === state.myTeam);
  const cpTeam = state.teams.find(t => t.team_key === state.cpTeam);
  if (!myTeam || state.overviewRows.length === 0) return;
  const rowsFor = tk => state.overviewRows.filter(r => r.team_key === tk);
  renderPositional('my', rowsFor(state.myTeam), myTeam.team_name);
  if (cpTeam) {
    renderPositional('cp', rowsFor(state.cpTeam), cpTeam.team_name);
  } else {
    document.getElementById('posLabel-cp').textContent = '';
    document.querySelector('#posTable-cp tbody').innerHTML = '';
  }
}

const STANCES = ['Contending', 'Balanced', 'Future-Focused'];

function renderProfile(mode, profile) {
  const bodyId = mode === 'my' ? 'myProfileBody' : 'cpProfileBody';
  const body = document.getElementById(bodyId);
  const chips = STANCES.map(s =>
    `<div class="chip ${s === profile.stance ? 'selected' : ''}" onclick="setStance('${mode}','${s}')">${s}</div>`
  ).join('');
  const badge = c => `<span class="tag ${c === 'high' ? 'surplus' : c === 'low' ? 'need' : 'neutral'}">${c}</span>`;
  let html = `
    <label>Stance (click to change)</label>
    <div class="chip-row">${chips}</div>
    <div class="signal-line">Avg roster age: <b>${profile.avg_roster_age ? profile.avg_roster_age.toFixed(1) : 'n/a'}</b> confidence: ${badge(profile.stance_confidence)}</div>
    <div class="signal-line">Risk threshold: <b>${profile.risk_threshold}</b> — cap room ${profile.cap_room_pct != null ? (profile.cap_room_pct * 100).toFixed(1) + '%' : 'n/a'} confidence: ${badge(profile.risk_confidence)}</div>
    <div class="signal-line">Trade activity: <b>${profile.trade_activity}</b> — ${profile.trade_count} trade(s) this season confidence: ${badge(profile.trade_activity_confidence)}</div>
  `;
  body.innerHTML = html;
}

function setStance(mode, stance) {
  const p = mode === 'my' ? state.myProfile : state.cpProfile;
  p.stance = stance;
  renderProfile(mode, p);
  // My stance is the one that prices the trade (see assetValue), so changing
  // it has to re-render every value on screen, not just the profile card. The
  // counterparty's stance is a read on THEM -- it moves no numbers.
  if (mode === 'my') {
    setOverviewStance(STANCE_KEY[stance] || 'balanced');
    renderAssetLists();
    renderBaskets();
    evaluateTrade();
  }
}

async function loadProfile(mode) {
  const teamKey = mode === 'my' ? state.myTeam : state.cpTeam;
  if (!teamKey) return;
  const profile = await api(`/teams/${teamKey}/profile?mode=${mode}`);
  if (mode === 'my') state.myProfile = profile; else state.cpProfile = profile;
  renderProfile(mode, profile);
  // The inferred stance is what prices the trade, and it arrives after the
  // asset tables may already have painted under the 'balanced' default --
  // re-run the same repricing an explicit stance click would.
  if (mode === 'my') setStance('my', profile.stance);
}

const fmtSalary = v => v == null ? '-' : '$' + Math.round(v).toLocaleString();

function assetName(a) {
  return a.asset_type === 'player' ? a.name : `${a.draft_season} R${a.round}${a.is_slotted ? '' : ' (future)'}`;
}
function assetPosition(a) {
  return a.asset_type === 'player' ? a.position : 'Pick';
}

const ASSET_COLS = [
  { key: 'Name', get: a => assetName(a), sort: (a, b) => assetName(a).localeCompare(assetName(b)) },
  { key: 'Pos', get: a => assetPosition(a), sort: (a, b) => a.side_of_ball_sort_order - b.side_of_ball_sort_order || a.position_sort_order - b.position_sort_order },
  { key: 'Age', get: a => a.age != null ? a.age.toFixed(1) : '-', sort: (a, b) => (a.age ?? Infinity) - (b.age ?? Infinity) },
  // Shows contract_value (the true salary) not cap_hit -- cap_hit is
  // suppressed to 0 for minors-placed players (ADR-0011 cap exemption), which
  // is correct for cap math but would misrepresent what the player is paid.
  { key: 'Salary', get: a => fmtSalary(a.contract_value), sort: (a, b) => (a.contract_value ?? 0) - (b.contract_value ?? 0) },
  { key: 'Value', get: a => assetValue(a).toFixed(1), sort: (a, b) => assetValue(a) - assetValue(b) },
];

let assetSort = { give: { col: 'Value', dir: -1 }, receive: { col: 'Value', dir: -1 } };

function setAssetSort(basketKey, col) {
  const s = assetSort[basketKey];
  if (s.col === col) s.dir *= -1; else { s.col = col; s.dir = 1; }
  renderAssetLists();
}

function renderAssetTable(basketKey, assets) {
  const tableId = basketKey === 'give' ? 'giveAssetsTable' : 'receiveAssetsTable';
  const bodyId = basketKey === 'give' ? 'giveAssets' : 'receiveAssets';
  const basket = basketKey === 'give' ? state.give : state.receive;
  const pickedIds = new Set(basket.map(a => a.asset_id));
  const s = assetSort[basketKey];

  const thead = document.querySelector(`#${tableId} thead`);
  thead.innerHTML = `<tr>${ASSET_COLS.map(c => {
    const arrow = s.col === c.key ? (s.dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th onclick="setAssetSort('${basketKey}','${c.key}')">${c.key}${arrow}</th>`;
  }).join('')}</tr>`;

  const col = ASSET_COLS.find(c => c.key === s.col);
  const sorted = assets.slice().sort((a, b) => col.sort(a, b) * s.dir);
  document.getElementById(bodyId).innerHTML = sorted.map(a => `
    <tr class="${pickedIds.has(a.asset_id) ? 'picked' : ''}" onclick="toggleAsset('${basketKey}', ${JSON.stringify(a).replace(/"/g, '&quot;')})">
      ${ASSET_COLS.map(c => `<td>${c.get(a)}</td>`).join('')}
    </tr>
  `).join('');
}

function renderAssetLists() {
  renderAssetTable('give', [...state.myAssets.players, ...state.myAssets.picks]);
  renderAssetTable('receive', [...state.cpAssets.players, ...state.cpAssets.picks]);
}

function toggleAsset(basketKey, asset) {
  const list = basketKey === 'give' ? state.give : state.receive;
  const idx = list.findIndex(a => a.asset_id === asset.asset_id);
  if (idx >= 0) list.splice(idx, 1); else list.push(asset);
  renderAssetLists();
  renderBaskets();
  renderCapCards();
  evaluateTrade();
}

function renderBaskets() {
  const render = (basketId, list) => {
    document.getElementById(basketId).innerHTML = list.length
      ? list.map(a => {
          const name = a.asset_type === 'player'
            ? `${a.name}${a.age != null ? ' (age ' + a.age.toFixed(1) + ')' : ''}`
            : `${a.draft_season} R${a.round}`;
          return `<div class="basket-item"><span>${name} — ${fmtSalary(a.contract_value)} (${assetValue(a).toFixed(1)})</span>
            <span class="x" onclick="removeAsset('${basketId === 'giveBasket' ? 'give' : 'receive'}','${a.asset_id}')">✕</span></div>`;
        }).join('')
      : '<span style="color:var(--muted)">empty</span>';
  };
  render('giveBasket', state.give);
  render('receiveBasket', state.receive);
}

function removeAsset(basketKey, assetId) {
  const list = basketKey === 'give' ? state.give : state.receive;
  const idx = list.findIndex(a => a.asset_id === assetId);
  if (idx >= 0) list.splice(idx, 1);
  renderAssetLists();
  renderBaskets();
  renderCapCards();
  evaluateTrade();
}

// True Cap = today's remaining_cap_current_yr, unaffected by the in-progress
// basket. Trade Result Cap = True Cap adjusted by the cap_hit swap: a team
// sheds the cap_hit of everything it gives away and absorbs the cap_hit of
// everything it receives.
function capCardHtml(team, trueCap, resultCap) {
  if (!team) return '';
  const delta = resultCap - trueCap;
  const deltaClass = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
  const deltaText = delta === 0 ? '' : ` (${delta > 0 ? '+' : ''}${fmtSalary(delta)})`;
  return `
    <div class="signal-line"><b>${team.team_name}</b></div>
    <div class="cap-line">Team Salary: <b>${fmtSalary(trueCap)}</b></div>
    <div class="cap-line">Team Salary After Trade: <b>${fmtSalary(resultCap)}</b><span class="${deltaClass}">${deltaText}</span></div>`;
}

function renderCapCards() {
  const myTeam = state.teams.find(t => t.team_key === state.myTeam);
  const cpTeam = state.teams.find(t => t.team_key === state.cpTeam);
  const sumCap = list => list.reduce((s, a) => s + (a.cap_hit ?? 0), 0);
  const giveSum = sumCap(state.give);
  const receiveSum = sumCap(state.receive);

  document.getElementById('capCard-my').innerHTML = myTeam
    ? capCardHtml(myTeam, myTeam.remaining_cap_current_yr, myTeam.remaining_cap_current_yr + giveSum - receiveSum)
    : '';
  document.getElementById('capCard-cp').innerHTML = cpTeam
    ? capCardHtml(cpTeam, cpTeam.remaining_cap_current_yr, cpTeam.remaining_cap_current_yr - giveSum + receiveSum)
    : '';
}

// Mirrors pareto.evaluate_trade() -- the summation half only. Every asset's
// per-stance `values` were computed in Python by pareto.asset_value() and
// shipped in the assets payload, so this duplicates no valuation logic; it
// adds the same numbers the endpoint added, under the stance selected by
// assetValue(). Keep in step with backend/pareto.py.
function evaluateTradeLocal() {
  const myTeam = state.teams.find(t => t.team_key === state.myTeam);
  const cpTeam = state.teams.find(t => t.team_key === state.cpTeam);
  // The league's same-conference rule. There is no server left to enforce it,
  // and none is needed -- this is a read-only calculator over public data, so
  // the check exists to keep the rule visible and the UI honest, not to defend
  // a trust boundary.
  if (myTeam && cpTeam && myTeam.conference !== cpTeam.conference) {
    return { error: 'Trades are only allowed within a conference.' };
  }
  const sum = assets => assets.reduce((acc, a) => acc + assetValue(a), 0);
  const give_total = sum(state.give);
  const receive_total = sum(state.receive);
  const delta = receive_total - give_total;
  const denom = Math.max(give_total, receive_total, 1e-9);
  return {
    give_total, receive_total, delta,
    asymmetry_pct: Math.abs(delta) / denom * 100,
    favors: delta > 0 ? 'receiving_side' : (delta < 0 ? 'giving_side' : 'even'),
  };
}

async function evaluateTrade() {
  if (state.give.length === 0 && state.receive.length === 0) {
    document.getElementById('diagnostic').textContent = 'Add assets to both sides to see the trade diagnostic.';
    document.getElementById('giveTotal').textContent = '0';
    document.getElementById('receiveTotal').textContent = '0';
    document.getElementById('barGive').style.width = '0%';
    document.getElementById('barReceive').style.width = '0%';
    return;
  }
  const result = evaluateTradeLocal();
  if (result.error) {
    document.getElementById('diagnostic').textContent = result.error;
    return;
  }
  document.getElementById('giveTotal').textContent = result.give_total.toFixed(1);
  document.getElementById('receiveTotal').textContent = result.receive_total.toFixed(1);
  const total = Math.max(result.give_total + result.receive_total, 1);
  document.getElementById('barGive').style.width = (result.give_total / total * 100) + '%';
  document.getElementById('barReceive').style.width = (result.receive_total / total * 100) + '%';

  const favorsText = result.favors === 'even' ? 'This trade is even.'
    : result.favors === 'receiving_side' ? `This trade favors <b>my team</b> by ${result.asymmetry_pct.toFixed(1)}%.`
    : `This trade favors the <b>counterparty</b> by ${result.asymmetry_pct.toFixed(1)}%.`;
  document.getElementById('diagnostic').innerHTML = favorsText;
}

async function loadAnalysis() {
  const myTeam = state.teams.find(t => t.team_key === state.myTeam);
  const cpTeam = state.teams.find(t => t.team_key === state.cpTeam);

  const [myAssets, cpAssets] = await Promise.all([
    api(`/teams/${state.myTeam}/assets`),
    api(`/teams/${state.cpTeam}/assets`),
  ]);

  renderTwoTeamOverview();

  document.getElementById('giveLabel').textContent = `${myTeam.team_name} gives`;
  document.getElementById('receiveLabel').textContent = `${myTeam.team_name} receives (from ${cpTeam.team_name})`;
  document.getElementById('giveBasketLabel').textContent = `${myTeam.team_name} trades away:`;
  document.getElementById('receiveBasketLabel').textContent = `${cpTeam.team_name} trades away:`;

  state.myAssets = myAssets;
  state.cpAssets = cpAssets;
  renderAssetLists();
  renderBaskets();
  renderCapCards();
}

init();
</script>

</body>
</html>
